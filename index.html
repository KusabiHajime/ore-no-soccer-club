/* ============ シーズン総括のシェア（1枚の画像＋Xへの投稿） ============
 * 画像は1600×900（Xのタイムラインで切り取られずに表示される16:9）。
 * 左：シーズンの結果、右：基本フォーメーション（顔・名前つき）、左下：主な控え7人。
 * 投稿は、共有メニュー（Web Share）が使える端末では画像と文章をまとめてXに渡す。
 * 使えない画面では「画像を保存」→「Xの投稿画面を開く（文章入り）」の2段階にする */
var SHARE_URL='https://kusabihajime.github.io/ore-no-soccer-club/';
var SH_LINE={GK:'#d27a12',DF:'#2f6fc8',MF:'#1f9a5c',FW:'#d33f62'};
var SH_FD="'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif",SH_FB="'BIZ UDPGothic','Hiragino Sans','Yu Gothic','Meiryo',sans-serif",SH_FN="'Barlow Condensed','BIZ UDPGothic',sans-serif";

/* そのシーズンの布陣のスナップショット。終了直後で記録がなければ、その場で作る */
function lineupOf(r){
 if(!r)return null;if(r.lu)return r.lu;
 if(S.seasonDone&&r===S.hist[S.hist.length-1]){r.lu=seasonLineup();return r.lu;}
 return null;
}
function shareRec(y){return y?S.hist.filter(function(x){return x.y===+y;})[0]:S.hist[S.hist.length-1];}
function shareText(r){
 var mc=myClub(),tn=TIERNAME[r.tier],up=/昇格/.test(r.fate),dn=/降格/.test(r.fate);
 var s=mc.name+'、'+seasonLabel(r.y)+'シーズンは'+tn+'で'+r.rank+'位（'+r.w+'勝'+r.d+'分'+r.l+'敗・勝点'+r.pts+'）。';
 if(r.rank===1)s+=tn+'優勝'+(up?'、'+r.fate:'')+'！';
 else if(up)s+=r.fate+'を決めました！';
 else if(dn)s+=r.fate+'……来季こそ巻き返します。';
 var cw=SH_CUP.filter(function(c){return r.cup&&r.cup[c[0]]==='優勝';}).map(function(c){return c[1];});
 if(cw.length)s+=cw.join('と')+'も制覇！';

function shareIntent(t){return 'https://twitter.com/intent/tweet?text='+encodeURIComponent(t);}

/* ---- 描画の部品 ---- */
function shSvgImg(svg){return new Promise(function(res){var im=new Image();im.onload=function(){res(im);};im.onerror=function(){res(null);};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));});}
function shFonts(){
 if(!document.fonts||!document.fonts.load)return Promise.resolve();
 var L=['400 40px "Dela Gothic One"','700 24px "BIZ UDPGothic"','400 24px "BIZ UDPGothic"','700 40px "Barlow Condensed"'].map(function(f){return document.fonts.load(f,'あA1').catch(function(){});});
 return Promise.race([Promise.all(L),new Promise(function(r){setTimeout(r,2500);})]);
}
function shRR(x,c,y,w,h,r){x.beginPath();x.moveTo(c+r,y);x.arcTo(c+w,y,c+w,y+h,r);x.arcTo(c+w,y+h,c,y+h,r);x.arcTo(c,y+h,c,y,r);x.arcTo(c,y,c+w,y,r);x.closePath();}
/* 幅に収まるまで文字を小さくする */
function shFit(x,t,maxW,size,min,weight,fam){var s=size;do{x.font=weight+' '+s+'px '+fam;if(x.measureText(t).width<=maxW)break;s--;}while(s>min);return s;}
function shRGBA(hex,a){var h=String(hex||'#1f4e9c').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');var n=parseInt(h,16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function shPill(x,t,cx,cy,bg,fg,size,fam,pad){
 x.font='700 '+size+'px '+fam;var w=x.measureText(t).width+pad*2,h=size+pad*1.2;
 x.fillStyle=bg;shRR(x,cx,cy-h/2,w,h,h/2);x.fill();x.fillStyle=fg;x.textBaseline='middle';x.textAlign='left';x.fillText(t,cx+pad,cy+1);x.textBaseline='alphabetic';
 return w;
}

/* ---- シェアの画面 ---- */
function shareSheet(y){
 var r=shareRec(y),lu=lineupOf(r);

function shareBtns(){
 var el=$('shbtn');if(!el||!UI.share)return;
 if(canShareFile())el.innerHTML='<button class="btn pri wide" data-act="shareX">'+ic('share')+'Xに投稿する（画像つき）</button><button class="btn wide" data-act="shareSave">'+ic('download')+'画像を保存</button><div class="small muted">共有メニューからXを選ぶと、画像と文章の入った投稿画面が開きます。</div>';
 else el.innerHTML='<button class="btn pri wide" data-act="shareSave">'+ic('download')+'① 画像を保存</button><a class="btn wide" id="sh-x" href="'+esc(shareIntent(UI.share.text))+'" target="_blank" rel="noopener">'+ic('share')+'② Xの投稿画面を開く</a><div class="small muted">文章の入った投稿画面が開きます。①で保存した画像を添付して投稿してください。</div>';
}
/* 共有メニューで画像と文章をXに渡す（ボタンを押した流れのまま呼ぶ必要がある） */
function shareX(){
 var s=UI.share;if(!s||!s.file)return;var ta=$('sh-t');if(ta)s.text=ta.value;
 try{
  navigator.share({files:[s.file],text:s.text}).then(function(){toast('共有メニューに渡しました');},function(e){
   if(e&&e.name==='AbortError')return;
   s.noWeb=true;shareBtns();toast('この画面では共有メニューが使えません。画像を保存してから投稿してください');
  });
 }catch(e){s.noWeb=true;shareBtns();}
}
/* 画像を保存：Claudeの中ではダウンロード機能（確認が出る）、単独のページではそのままダウンロード */
function shareSave(){
 var s=UI.share;if(!s||!s.blob)return;
 var C=window.claude;
 function direct(){try{var u=URL.createObjectURL(s.blob),a=document.createElement('a');a.href=u;a.download=s.name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove();},4000);toast('画像を保存しました');}catch(e){toast('この画面では画像を保存できません。画像を長押しして保存してください');}}
 if(C&&typeof C.use==='function'){
  C.use('downloads').then(function(dl){
   if(!dl){direct();return;}
   dl.save({filename:s.name,data:s.blob}).then(function(){toast('画像を保存しました');},function(e){var c=e&&e.code;if(c==='declined')toast('保存をやめました');else if(c==='rate_limited')toast('少し待ってから、もう一度お試しください');else direct();});
  },direct);
  return;
 }
 direct();
}

})();
</script>
</body>
</html>
