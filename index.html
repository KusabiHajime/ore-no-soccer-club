<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>俺のサッカークラブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: 上にクラブカラーの帯（エンブレム・日付・資金）、中央に画面、下に「進める」と5つのタブ。クラブカラーはJSで --club 系に入る */
:root{
 --bg:#eef1ee; --surface:#ffffff; --surface2:#f4f7f4; --line:#d8dfd9; --line2:#e7ece8; --fg:#17201b; --muted:#5f6d65;
 --accent:#17694a; --accent-fg:#ffffff; --accent-soft:#dcefe5;
 --club:#1f4e9c; --club-ink:#ffffff; --club2:#f2c230; --club-soft:rgba(31,78,156,.12);
 --warn:#a96300; --warn-soft:#fbefd9; --bad:#c0392b; --bad-soft:#f8e1de; --good:#1f8a4c; --good-soft:#dcefe5; --info-soft:#e3ebf7;
 --win:#1f8a4c; --draw:#7b8794; --loss:#c0392b; --pitch:#2f7d52; --pitch2:#2b744c; --pitch-line:rgba(255,255,255,.55);
 --gS:#d9a520; --gA:#e0466c; --gB:#ec7a2e; --gC:#d7a91f; --gD:#7fb22c; --gE:#2fa66b; --gF:#3a7fd0; --gG:#8b939c; --gtext:#ffffff;
 --lGK:#d27a12; --lDF:#2f6fc8; --lMF:#1f9a5c; --lFW:#d33f62;
 --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.05);
 --f-disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
 --f-body:'BIZ UDPGothic','Hiragino Sans','Yu Gothic','Meiryo',system-ui,sans-serif;
 --f-num:'Barlow Condensed','BIZ UDPGothic',system-ui,sans-serif;
 --r:12px; --face-bg:#dce6e0; --club-ic:#1f4e9c;
 /* グラフの色（カテゴリ4色は色覚多様性に配慮して検証済みの順番。余剰は背景寄りの灰、不足は警告色） */
 --v1:#2a78d6; --v2:#eb6834; --v3:#1baf7a; --v4:#eda100; --v-rest:#dfe5e1; --v-crit:#d03b3b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0f1512; --surface:#18201c; --surface2:#1f2924; --line:#2e3b34; --line2:#26312b; --fg:#e4ebe7; --muted:#98a79e;
 --accent:#4fbf8a; --accent-fg:#0d1a13; --accent-soft:#1d3a2c;
 --warn:#f0b04a; --warn-soft:#3a2d16; --bad:#ef6b5d; --bad-soft:#3d1f1c; --good:#58c98a; --good-soft:#1d3a2c; --info-soft:#1d2a3d;
 --win:#58c98a; --draw:#8d99a5; --loss:#ef6b5d; --pitch:#1f5a3b; --pitch2:#1c5336; --pitch-line:rgba(255,255,255,.35);
 --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v-rest:#2d3a33;
 --shadow:none; --face-bg:#2a3631; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1512; --surface:#18201c; --surface2:#1f2924; --line:#2e3b34; --line2:#26312b; --fg:#e4ebe7; --muted:#98a79e;
 --accent:#4fbf8a; --accent-fg:#0d1a13; --accent-soft:#1d3a2c;
 --warn:#f0b04a; --warn-soft:#3a2d16; --bad:#ef6b5d; --bad-soft:#3d1f1c; --good:#58c98a; --good-soft:#1d3a2c; --info-soft:#1d2a3d;
 --win:#58c98a; --draw:#8d99a5; --loss:#ef6b5d; --pitch:#1f5a3b; --pitch2:#1c5336; --pitch-line:rgba(255,255,255,.35);
 --v1:#3987e5; --v2:#d95926; --v3:#199e70; --v4:#c98500; --v-rest:#2d3a33;
 --shadow:none; --face-bg:#2a3631; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{overflow:hidden;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#scroller{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#title-screen{position:fixed;inset:0;overflow-y:auto;overscroll-behavior:contain}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
h2{font-family:var(--f-disp);font-weight:400;font-size:19px;margin:0;line-height:1.3;text-wrap:balance;letter-spacing:.02em}
h3{font-size:14px;margin:0;color:var(--fg);font-weight:700;line-height:1.3}
.hd{display:flex;align-items:center;gap:8px}
.hd .ti{width:26px;height:26px;border-radius:8px;background:var(--club-soft);color:var(--club-ic);display:grid;place-items:center;flex:0 0 auto}
.hd .ti .ico{width:16px;height:16px}
.qi{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);display:inline-grid;place-items:center;padding:0;margin-left:auto;flex:0 0 auto}
.qi .ico{width:14px;height:14px}
p{margin:0}
/* ---- ヘッダー（クラブカラー） ---- */
.top{position:relative;flex:0 0 auto;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--club);color:var(--club-ink);box-shadow:0 2px 10px rgba(0,0,0,.14);background-image:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.06))}
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding-block:8px}
.hud .emb{width:46px;height:46px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.hud .id{min-width:0;display:flex;flex-direction:column;gap:5px}
.hud .nm{font-family:var(--f-disp);font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hres{display:flex;gap:6px;flex-wrap:nowrap;min-width:0}
.rs{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.18);border-radius:999px;padding:2px 8px 2px 5px;font-size:11px;white-space:nowrap}
.rs .ico{width:14px;height:14px}
.rs b{font-family:var(--f-num);font-size:15px;line-height:1}
.dtile{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;background:var(--surface);color:var(--fg);border-radius:10px;padding:4px 6px 5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.dtile small{font-size:9px;color:var(--muted);font-family:var(--f-num);font-weight:600;letter-spacing:.04em}
.dtile b{font-family:var(--f-num);font-size:21px;line-height:1}
.dtile span{font-size:10px;font-weight:700}
.dtile span.sun{color:var(--bad)}.dtile span.sat{color:var(--lDF)}
.tierb{display:inline-block;font-family:var(--f-num);font-weight:700;font-size:12px;padding:0 6px;border-radius:4px;background:var(--club-ink);color:var(--club);margin-right:6px;vertical-align:2px}
.tbar{display:inline-block;vertical-align:middle;width:30px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-left:3px}
.tbar i{display:block;height:100%;background:currentColor}
.ico{width:18px;height:18px;flex:0 0 auto;vertical-align:-3px}
/* ---- 本文 ---- */
#view{padding-block:14px 28px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.hl{border-color:var(--club)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv>span:last-child{text-align:right}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;line-height:1.3;box-shadow:inset 0 -2px 0 rgba(0,0,0,.07);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:translateY(1px)}
.btn .ico{width:16px;height:16px}
.btn.pri{background:var(--club);border-color:rgba(0,0,0,.12);color:var(--club-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.btn.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.wide{width:100%;padding:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12px;line-height:1.3}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.subtabs{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:1 0 auto;border:0;background:none;border-radius:7px;padding:7px 10px;font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.subtabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap;line-height:1.5}
.pill.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.pill.info{background:var(--info-soft);border-color:transparent;color:var(--lDF)}
.res{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;vertical-align:middle}
.res.W{background:var(--win)}.res.D{background:var(--draw)}.res.L{background:var(--loss)}
/* ランク色 */
.g{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:4px;font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--gtext);line-height:1}
.g.S{background:var(--gS)}.g.A{background:var(--gA)}.g.B{background:var(--gB)}.g.C{background:var(--gC)}.g.D{background:var(--gD)}.g.E{background:var(--gE)}.g.F{background:var(--gF)}.g.G{background:var(--gG)}
/* OVRボックス */
.ovr{display:grid;place-items:center;min-width:46px;height:46px;border-radius:9px;color:var(--gtext);line-height:1;padding:0 4px}
.ovr b{font-family:var(--f-num);font-size:24px;font-weight:700}
.ovr small{font-size:9px;letter-spacing:.08em;opacity:.95;font-family:var(--f-num);font-weight:600}
.ovr.S{background:var(--gS)}.ovr.A{background:var(--gA)}.ovr.B{background:var(--gB)}.ovr.C{background:var(--gC)}.ovr.D{background:var(--gD)}.ovr.E{background:var(--gE)}.ovr.F{background:var(--gF)}.ovr.G{background:var(--gG)}
.ovr.big{min-width:64px;height:64px}.ovr.big b{font-size:34px}
.pos{display:inline-grid;place-items:center;min-width:38px;height:22px;font-family:var(--f-num);font-weight:700;font-size:13px;border-radius:5px;color:#fff;padding:0 4px}
.pos.GK{background:var(--lGK)}.pos.DF{background:var(--lDF)}.pos.MF{background:var(--lMF)}.pos.FW{background:var(--lFW)}
.apt{font-weight:700;font-size:12px}
.apt.a3{color:var(--good)}.apt.a2{color:var(--lDF)}.apt.a1{color:var(--warn)}.apt.a0{color:var(--bad)}
/* 表 */
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:700;text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 4px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.r,th.r{text-align:right}
tr.me td{background:var(--club-soft);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 0 var(--good)}
tr.po td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tr.dn td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.click{cursor:pointer}
/* 選手リスト */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border:0;border-bottom:1px solid var(--line2);cursor:pointer;background:none;text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--surface2)}
.prow .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:1px}
.prow .ovr{min-width:42px;height:42px}.prow .ovr b{font-size:21px}
.cond{width:34px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
.cond i{display:block;height:100%;background:var(--good)}
/* ピッチ */
.pitch{position:relative;width:100%;max-width:440px;aspect-ratio:2/3;margin:0 auto;background:repeating-linear-gradient(0deg,var(--pitch) 0 10%,var(--pitch2) 10% 20%);border-radius:10px;overflow:hidden}
.pitch:before{content:'';position:absolute;inset:5%;border:1.5px solid var(--pitch-line);border-radius:2px}
.pitch:after{content:'';position:absolute;left:5%;right:5%;top:50%;border-top:1.5px solid var(--pitch-line)}
.pitch .box{position:absolute;left:28%;right:28%;height:13%;border:1.5px solid var(--pitch-line)}
.pitch .pp{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;text-align:center;cursor:pointer;background:none;border:0;padding:0;color:#fff}
.pitch .pp b.n{font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:1px 5px;border-radius:4px;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.pitch .pp .pb{position:absolute;left:-15px;bottom:-4px;font-style:normal;font-family:var(--f-num);font-weight:700;font-size:10px;line-height:14px;padding:0 3px;border-radius:4px;color:#fff;background:var(--lMF);box-shadow:0 0 0 1.5px rgba(255,255,255,.9);white-space:nowrap}
.pitch .pp .pb.GK{background:var(--lGK)}.pitch .pp .pb.DF{background:var(--lDF)}.pitch .pp .pb.FW{background:var(--lFW)}
/* 適性マップ */
.aptmap{position:relative;width:100%;max-width:300px;aspect-ratio:4/5;margin:0 auto;background:var(--pitch);border-radius:8px}
.aptmap .ap{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:#fff;text-align:center;line-height:1.15}
.aptmap .ap i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-weight:700;font-size:15px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.6)}
.aptmap .ap.a3 i{background:var(--good);border-color:#fff}.aptmap .ap.a2 i{background:var(--lDF)}.aptmap .ap.a1 i{background:var(--warn)}.aptmap .ap.a0 i{opacity:.55}
.aptmap .ap b{font-family:var(--f-num);font-size:13px}
.aptmap .ap span{white-space:nowrap}
/* 下部：進行ボタンとタブ */
.dock{position:relative;flex:0 0 auto;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.adv{display:flex;flex-direction:column;gap:6px;padding-block:7px 8px}
.adv .ni{display:flex;gap:8px;align-items:baseline;min-width:0;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden}
.adv .ni b{font-size:13px;flex:0 0 auto}
.adv .ni span{overflow:hidden;text-overflow:ellipsis;color:var(--muted);min-width:0}
.adv .btns{display:flex;gap:6px}
.adv .btns .btn{flex:1 1 0;min-width:0;white-space:nowrap;padding-inline:6px}
.adv .btns .btn.pri,.adv .btns .btn.bad{flex-grow:1.35}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line2)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 7px;font-size:11px;color:var(--muted);position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--fg);font-weight:700}
.nav button.on svg{color:var(--club)}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
/* 秘書 */
.sec{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.sec .av{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px var(--club),0 2px 6px rgba(0,0,0,.15)}
.face{display:block;border-radius:50%;flex:0 0 auto}
.sec .bub{background:var(--surface2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.todo:first-child{border-top:0;padding-top:0}
.todo .lv{width:8px;height:8px;border-radius:50%;margin-top:6px}
.todo .lv.must{background:var(--bad)}.todo .lv.soon{background:var(--warn)}.todo .lv.tip{background:var(--lDF)}
.todo b{display:block;font-size:14px}
.todo span{font-size:12px;color:var(--muted)}
/* モーダル */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,13,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:640px;max-height:90%;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
.sheet .close{align-self:flex-end;margin-bottom:-6px}
.sheet>*{flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:146px;z-index:50;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
#busy{position:fixed;inset:0;z-index:60;background:rgba(10,16,13,.45);display:grid;place-items:center}
#busy div{background:var(--surface);padding:16px 20px;border-radius:10px;font-weight:700}
.news{display:flex;flex-direction:column;font-size:13px}
.news div{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;padding:4px 0;border-bottom:1px solid var(--line2)}
.news div:last-child{border-bottom:0}
.news .i{font-weight:700}
.msg{border-left:3px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--surface2);border-radius:0 8px 8px 0}
.msg.offer{border-left-color:var(--warn)}
.msg .t{font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:var(--bad)}
.bar.att i{background:var(--muted)}.bar.att.good i{background:var(--good)}.bar.att.warn i{background:var(--warn)}.bar.att.bad i{background:var(--bad)}
.msg.plea{border-left-color:var(--lDF)}
.abrow{display:grid;grid-template-columns:96px 24px 30px minmax(0,1fr);gap:8px;align-items:center}
.abrow .bar{height:7px}
.abrow .bar i{background:var(--club)}
.abdesc{font-size:11px;color:var(--muted);grid-column:1 / -1;margin-top:-4px;padding-left:2px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:15px;color:var(--fg);width:100%;font-weight:400}

/* タイトル・クラブ創設 */
.m-wiz{padding-block:24px 48px}
/* ---- タイトル・セーブデータ選択：夜のスタジアム（テーマに関係なく暗い） ---- */
#title-screen.m-title,#title-screen.m-sel{background:#06110d;color:#f3efe0;color-scheme:dark}
.tbg{position:fixed;inset:0;overflow:hidden;pointer-events:none;display:none;perspective:600px;perspective-origin:50% 60%}
.m-title .tbg,.m-sel .tbg{display:block}
.tbg>*{position:absolute}
.tbg .sky{inset:0;background:radial-gradient(130% 75% at 50% 110%,#1d6e47 0%,#103f2a 36%,#08201a 60%,#040c09 100%)}
.tbg .field{left:-60%;right:-60%;bottom:0;height:150%;transform:rotateX(74deg);transform-origin:50% 100%;background:repeating-linear-gradient(180deg,#217d50 0 10%,#1b6f46 10% 20%)}
.tbg .field svg{position:absolute;inset:0;width:100%;height:100%}
.tbg .fog{inset:0;background:linear-gradient(180deg,#040c09 0%,rgba(4,12,9,.9) 45%,rgba(4,12,9,.55) 66%,rgba(4,12,9,.05) 84%,rgba(4,12,9,.4) 100%)}
.tbg .beam{top:2%;height:100%;width:62%;background:linear-gradient(180deg,rgba(255,243,200,.34),rgba(255,243,200,.06) 60%,rgba(255,243,200,0) 85%);filter:blur(8px)}
.tbg .beam.l{left:-6%;clip-path:polygon(14% 0,26% 0,100% 100%,30% 100%)}
.tbg .beam.r{right:-6%;clip-path:polygon(74% 0,86% 0,70% 100%,0 100%)}
.tbg .lamp{top:4.5%;width:58px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;background:#0b1712;border-radius:3px}
.tbg .lamp.l{left:6%;transform:rotate(-8deg)}.tbg .lamp.r{right:6%;transform:rotate(8deg)}
.tbg .lamp i{height:8px;border-radius:2px;background:#fffbea;box-shadow:0 0 8px 2px rgba(255,240,190,.85),0 0 34px 10px rgba(255,236,170,.22)}
.tbg .dim{inset:0;background:rgba(4,12,9,.7);opacity:0;transition:opacity .35s}
.m-sel .tbg .dim{opacity:1}
.tbody{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column}
.tt{flex:1 0 auto;width:100%;border:0;background:none;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3.2vh,26px);padding:calc(clamp(16px,5vh,40px) + env(safe-area-inset-top,0px)) 16px clamp(16px,5vh,48px);-webkit-tap-highlight-color:transparent}
.tt:focus-visible{outline:none}
.tt:focus-visible .tt-go{outline:2px solid #f2c230;outline-offset:8px;border-radius:4px}
.tt-logo{display:flex;flex-direction:column;align-items:center;line-height:1;font-family:var(--f-disp)}
.tt-logo small{font-size:clamp(18px,min(6.6vw,5.4vh),36px);letter-spacing:.32em;margin-left:.32em;color:#f2c230;text-shadow:0 2px 0 #062016,0 0 18px rgba(242,194,48,.35)}
.tt-logo b{font-weight:400;white-space:nowrap;font-size:clamp(32px,min(11.6vw,10.5vh),92px);margin-top:10px;color:#fffaf0;text-shadow:0 3px 0 #f2c230,0 6px 0 #b98a0c,0 9px 0 #0d3a27,0 12px 0 #072519,0 20px 34px rgba(0,0,0,.6)}
.tt-steps{display:flex;align-items:flex-end;gap:4px;height:48px}
.tt-steps i{font-style:normal;font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.04em;width:48px;padding-top:4px;text-align:center;background:rgba(255,255,255,.09);border-top:2px solid rgba(255,255,255,.4);color:rgba(243,239,224,.8)}
.tt-steps i:nth-child(1){height:21px}.tt-steps i:nth-child(2){height:30px}.tt-steps i:nth-child(3){height:39px}
.tt-steps i:nth-child(4){height:48px;background:#f2c230;border-color:#fff2b0;color:#0b2a1d;box-shadow:0 0 24px rgba(242,194,48,.45)}
.tt-go{margin-top:9vh;white-space:nowrap;font-weight:700;font-size:15px;letter-spacing:.26em;padding:10px clamp(28px,12vw,64px) 10px calc(clamp(28px,12vw,64px) + .26em);background:linear-gradient(90deg,rgba(4,12,9,0),rgba(4,12,9,.72) 22%,rgba(4,12,9,.72) 78%,rgba(4,12,9,0));color:#fff6d8;text-shadow:0 0 14px rgba(255,236,170,.55);animation:ttblink 1.8s ease-in-out infinite}
.tt-foot{position:relative;padding:28px 16px calc(34px + env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(to top,rgba(4,12,9,.92) 0%,rgba(4,12,9,.8) 62%,rgba(4,12,9,0) 100%)}
.tt-note{margin:0 auto;max-width:48em;font-size:11px;line-height:1.7;letter-spacing:.04em;color:rgba(243,239,224,.72);word-break:auto-phrase;text-wrap:balance}
.tt-ver{position:absolute;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12px;font-weight:600;letter-spacing:.06em;color:rgba(243,239,224,.45);z-index:1}
@keyframes ttblink{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes ttlamp{0%{opacity:0}14%{opacity:.9}22%{opacity:.1}34%{opacity:1}100%{opacity:1}}
@keyframes ttfade{from{opacity:0}to{opacity:1}}
@keyframes ttrise{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.intro .tbg .lamp i{animation:ttlamp .9s linear both}
.intro .tbg .lamp.r i{animation-delay:.18s}
.intro .tbg .beam,.intro .tbg .field{animation:ttfade 1.1s ease-out .45s both}
.intro .tt-logo{animation:ttrise .75s cubic-bezier(.2,.8,.2,1) .9s both}
.intro .tt-steps{animation:ttfade .5s ease-out 1.35s both}
.intro .tt-go{animation:ttfade .4s ease-out 1.7s both,ttblink 1.8s ease-in-out 2.1s infinite}
.intro .tt-foot{animation:ttfade .4s ease-out 1.7s both}
.ss{width:100%;max-width:560px;margin:0 auto;flex:1 0 auto;display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));animation:ttfade .3s ease-out both}
.ss-top{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;align-items:center;text-align:center}
.ss-top h2{font-size:20px;letter-spacing:.14em;color:#fffaf0}
.ss .ib{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#f3efe0}
.slots{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.slotw{position:relative}
.slot{width:100%;min-height:92px;display:grid;grid-template-columns:26px 52px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:14px 56px 14px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:linear-gradient(100deg,var(--sc,rgba(31,78,156,.6)) 0%,rgba(255,255,255,.04) 58%),rgba(8,24,18,.82);color:#f3efe0;box-shadow:0 10px 26px rgba(0,0,0,.35);transition:border-color .15s,transform .15s,box-shadow .15s}
.slot:hover,.slot:focus-visible{border-color:#f2c230;outline:none}
.slot:active{transform:scale(.99)}
.slot.picked{border-color:#f2c230;box-shadow:0 0 0 3px rgba(242,194,48,.4),0 10px 26px rgba(0,0,0,.35)}
.slot .sn{font-size:28px;font-weight:700;line-height:1;text-align:center;color:rgba(255,250,240,.92)}
.slot .se{width:52px;height:52px;display:grid;place-items:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.slot .si{min-width:0;display:flex;flex-direction:column;gap:3px}
.slot .si b{font-size:16px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .si small{font-size:12px;color:rgba(243,239,224,.86);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.slot .si small.lt{color:rgba(243,239,224,.58)}
.slot .tp{font-family:var(--f-num);font-weight:700;font-size:12px;line-height:1;padding:3px 6px 2px;border-radius:4px;background:#f2c230;color:#0b2a1d}
.slot.is-new{background:rgba(255,255,255,.035);border:1.5px dashed rgba(255,255,255,.26);box-shadow:none;padding-right:14px}
.slot.is-new .se{border-radius:50%;width:44px;height:44px;margin-inline:4px;background:rgba(255,255,255,.08);color:#f2c230;filter:none}
.slot.is-new .se .ico{width:24px;height:24px}
.slot.is-new .si small{color:rgba(243,239,224,.5)}
.slot.bad{opacity:.7;background:rgba(255,255,255,.04)}
.slot.bad .se .ico{width:22px;height:22px}
.slot-del{position:absolute;top:50%;right:10px;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.28);color:rgba(243,239,224,.78);display:grid;place-items:center;padding:0}
.slot-del:hover{color:#ffb4a8;border-color:rgba(255,180,168,.5)}
.slot-del .ico{width:19px;height:19px}
.ss-imp{align-self:center;margin-top:auto;display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:rgba(243,239,224,.72);font-size:13px;padding:12px 10px}
.ss-imp .ico{width:17px;height:17px}
.ss-imp:hover{color:#fff6d8}
.ss-imp.strong{margin-top:6px;align-self:stretch;justify-content:center;background:#f2c230;color:#0b2a1d;font-weight:700;font-size:15px;border-radius:12px;padding:14px}
.ss-imp.strong:hover{color:#0b2a1d;filter:brightness(1.05)}
.ss-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(242,194,48,.14);border:1px solid rgba(242,194,48,.5);color:#fff6d8;font-size:13px;line-height:1.6}
.ss-note .ico{width:20px;height:20px;flex:0 0 auto;color:#f2c230;margin-top:1px}
.card.bk{border-color:var(--warn);background:var(--warn-soft)}
.bkh{display:flex;align-items:center;gap:8px;color:var(--warn)}
.bkh .ico{width:20px;height:20px;flex:0 0 auto}
.bkh b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.tbg *,.tbody *,.ss{animation:none!important;transition:none!important}}
.preview{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;border-radius:var(--r);padding:14px;background:var(--club);color:var(--club-ink)}
.preview .pn{font-family:var(--f-disp);font-size:20px;line-height:1.2;word-break:break-all}
.preview .ps{font-size:12px;opacity:.9}
.step{display:flex;flex-direction:column;gap:10px}
.step h3{display:flex;gap:8px;align-items:center}
.step h3 i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:11px;letter-spacing:0}
.sw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}
.sw input[type=color]{width:36px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.opt.on{border-color:var(--club);box-shadow:inset 0 0 0 1px var(--club)}
.opt b{font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.opts-pts{margin:4px 0 0;padding-left:1.2em;font-size:12px;line-height:1.55;color:var(--fg)}
.opts-pts li{margin:0}
.embs{display:flex;flex-wrap:wrap;gap:6px}
.embs button{width:46px;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px}
.embs button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.embs.syms button{width:58px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px}
.embs.syms small{font-size:10px;line-height:1.1;color:var(--muted);white-space:nowrap}
.embs.syms button.on small{color:var(--fg);font-weight:700}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}
details summary{cursor:pointer;font-weight:700}
.radar{display:block;width:100%;max-width:340px;margin:0 auto}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;text-align:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;background:none;border:0;padding:0}

.vs .t .fm{display:flex;gap:2px}
.vs .t .res{width:16px;height:16px;font-size:10px;border-radius:3px}
.vs .x{font-family:var(--f-disp);font-size:16px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;font-size:13px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.cmp>span:nth-child(3n+1){text-align:right}
.cmp>span:nth-child(3n+2){font-size:11px;color:var(--muted);text-align:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{border:1px solid var(--line);border-radius:8px;padding:4px 2px 5px;text-align:center;font-size:10px;line-height:1.25;min-width:0;color:var(--muted);background:var(--surface)}
.day b{display:block;font-family:var(--f-num);font-size:17px;color:var(--fg)}
.day i{font-style:normal;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:13px}
.day.m{background:var(--club-soft);color:var(--fg)}
.day.m i{font-weight:700}
.day.today{border-color:var(--club);box-shadow:inset 0 0 0 1px var(--club)}
.day.sun span{color:var(--bad)}.day.sat span{color:var(--lDF)}
.kick{display:flex;flex-direction:column;gap:10px;border:2px solid var(--club);border-radius:var(--r);padding:14px;background:var(--surface)}
.stt{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:3px 8px;align-items:center;font-size:13px}
.stt .l{text-align:left;font-family:var(--f-num);font-weight:700;font-size:15px}.stt .r{text-align:right;font-family:var(--f-num);font-weight:700;font-size:15px}
.stt .c{display:flex;flex-direction:column;gap:2px;text-align:center;font-size:11px;color:var(--muted)}

.sbar i{display:block;height:100%;background:var(--club)}.sbar u{display:block;height:100%;background:var(--muted);opacity:.55;flex:1}
.zg{display:grid;grid-template-columns:40px repeat(3,minmax(0,1fr));gap:4px;font-size:12px;align-items:stretch}
.zg>b{text-align:center;font-size:11px;color:var(--muted)}
.zg>span{display:flex;align-items:center;font-size:11px;color:var(--muted)}
.zg>i{font-style:normal;border-radius:7px;padding:6px 2px;text-align:center;font-weight:700;line-height:1.25;background:var(--surface2);border:1px solid var(--line)}

.zg>i.zgood{background:var(--good-soft);color:var(--good);border-color:transparent}.zg>i.zbad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.anh{font-weight:700;font-size:15px;line-height:1.5}
.anl{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:13px}

.gl{display:flex;flex-direction:column;gap:2px;font-size:13px}
.gl div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:6px;padding:3px 0;border-bottom:1px solid var(--line2)}

.gl .mn{font-family:var(--f-num);font-weight:700}

/* ============ 汎用・選手・監督・試合エンジン ============ */
function rnd(){return Math.random();}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function gauss(m,s){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pois(l){if(l<=0)return 0;var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function sum(a,f){var s=0;for(var i=0;i<a.length;i++)s+=f?f(a[i],i):a[i];return s;}
function wpick(items,wf){var t=0,i,w=[];for(i=0;i<items.length;i++){w[i]=Math.max(0,wf(items[i]));t+=w[i];}if(t<=0)return items[Math.floor(Math.random()*items.length)];var r=Math.random()*t;for(i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i];}return items[items.length-1];}

/* ---------- 選手 ---------- */
function ovrAt(p,pos){var w=OW[pos],a=p.ab;return w.off*a.off+w.def*a.def+w.pow*a.pow+w.spd*a.spd+w.tec*a.tec+w.sta*a.sta;}
function ovr(p){return ovrAt(p,p.pos);}
/* ポジション適性：0=× 1=△ 2=○ 3=◎（本職） */
function aptOf(p,pos){if(p.pos===pos)return 3;if(p.apt&&p.apt[pos]!=null)return p.apt[pos];return 0;}
function fitOf(p,pos){
 if(pos==='GK'&&p.pos!=='GK')return .35;
 if(p.pos==='GK'&&pos!=='GK')return .45;
 return APT_M[aptOf(p,pos)];
}
function genApt(pos,foot){
 var a={};a[pos]=3;
 if(pos==='GK')return a;
 POS.forEach(function(q){
  if(q===pos||q==='GK')return;
  var rl=posRel(pos,q);if(!rl){a[q]=0;return;}
  if(rl===1){var r1=rnd();a[q]=r1<.02?2:r1<.13?1:0;return;}
  var b=fitSim(pos,q),sd=POS_SIDE[q];
  if(sd&&foot){if(foot==='B')b+=.03;else if(foot===sd)b+=.02;else b-=.05;}
  a[q]=b>=.9?(rnd()<.55?2:1):b>=.84?(rnd()<.3?2:rnd()<.75?1:0):b>=.76?(rnd()<.45?1:0):(rnd()<.06?1:0);
 });
 return a;
}
/* 利き足：左サイドの選手ほど左利きが多い（ウイングは逆足も多い） */
function genFoot(pos){
 if(rnd()<.04)return 'B';
 var sd=POS_SIDE[pos],w=bpos(pos)==='WG',pl=sd==='L'?(w?.4:.62):sd==='R'?(w?.3:.06):.2;
 return rnd()<pl?'L':'R';
}
/* 不慣れなポジションでも、出場を重ねると適性がつく（進み具合は適応力と年齢しだい）
 * ×→△ 約600分、△→○ 約1,500分、○→◎ 約4,000分（適応力1.0・25歳前後の目安） */
var APT_TH=[600,1500,4000];
function aptGrow(p,pos,mins){
 if(!p||p.ghost||!mins||pos===p.pos||pos==='GK'||p.pos==='GK')return null;
 var rl=posRel(p.pos,pos);if(!rl)return null;
 var cur=aptOf(p,pos);if(cur>=3)return null;
 var a=p.age,af=a<=21?1.3:a<=25?1.1:a<=29?1:a<=32?.8:.6,same=bpos(pos)===bpos(p.pos)?1.5:rl===1?.35:1;
 p.ax=p.ax||{};p.ax[pos]=(p.ax[pos]||0)+mins*(p.adapt||1)*af*same;
 if(p.ax[pos]>=APT_TH[cur]){p.ax[pos]=0;p.apt=p.apt||{};p.apt[pos]=cur+1;return cur+1;}
 return null;
}
/* 起用時の重み：本職と隣のポジション以外は、ほかに人がいないときの最後の手段 */
function placeF(p,pos){return [.55,.85,1][posRel(p.pos,pos)];}
/* 隣り合わないポジションの適性（旧版のセーブや生成で付いたもの）を外す */
function pruneFarApt(){for(var id in S.P){var p=S.P[id];['apt','ax'].forEach(function(k){var o=p[k];if(!o)return;Object.keys(o).forEach(function(q){if(q!==p.pos&&!posRel(p.pos,q))delete o[q];});});}}
function aptProgress(p,pos){var cur=aptOf(p,pos);if(cur>=3)return 1;return clamp(((p.ax&&p.ax[pos])||0)/APT_TH[cur],0,1);}
function subPos(p){return POS.filter(function(q){return q!==p.pos&&aptOf(p,q)>=2;});}
function effAt(p,pos){return ovrAt(p,pos)*fitOf(p,pos);}
function salFor(o){return Math.round(100*Math.exp(.12*(o-40))/10)*10;}             /* 年俸の相場（万円） */
function marketSal(p,t){return Math.max(MIN_SAL[t]||0,Math.round(salFor(ovr(p))*tierPay(t)/10)*10);}  /* カテゴリ相応の年俸 */
/* 監督の年俸相場 */
function coachQ(c){return (c.tac*2+c.dev)/3;}
function coachPayAt(c,t){var P=COACH_PAY[t];return Math.max(P.min,P.b*Math.exp(.06*(coachQ(c)-P.q)));}
function coachNatTier(c){var q=coachQ(c);return q>=63?'J1':q>=56?'J2':q>=50?'J3':'JFL';}
function coachWorth(c){return coachPayAt(c,coachNatTier(c));}
function valueOf(p){                                                               /* 市場価値（万円） */
 var o=ovr(p),a=p.age,m=a<=20?2.3:a<=23?1.9:a<=26?1.5:a<=29?1.1:a<=31?.7:.35;
 var room=Math.max(0,(p.pot||o)-o);m*=1+room*.03;
 /* JFL・J3水準の選手は移籍金の相場そのものが低い（J1水準で1倍） */
 var low=clamp(.3+.7*(o-44)/26,.3,1);
 return Math.round(salFor(o)*m*1.6*low/10)*10;
}
function natOf(p){return p.nat||'JPN';}
function isForeign(p){return natOf(p)!=='JPN';}
/* 外国籍枠に数えるか（提携国の選手はJ1〜J3では数えない） */
function countsF(p,tier){var n=natOf(p);if(n==='JPN')return false;if(PARTNER[n]&&tier&&tier!=='JFL')return false;return true;}
function natLabel(p){var n=natOf(p);return n==='JPN'?'日本':FOREIGN[n]?FOREIGN[n].label:'外国籍';}
function pname(p){if(!isForeign(p))return p.sei+' '+p.mei;var F=FOREIGN[p.nat];return F&&F.sf?p.sei+'・'+p.mei:p.mei+(p.sei?'・'+p.sei:'');}

var _pid=1;
function newPid(){return 'p'+(_pid++);}
/* target: 総合値の目安, age: 年齢 */
function makePlayer(pos,target,age,opt){
 opt=opt||{};
 var nm=opt.foreign?foreignName(opt.nat):jpName();
 var b=PBIAS[pos],ab={},k,i;
 var m=target;
 for(i=0;i<ABK.length;i++){k=ABK[i];ab[k]=m+b[k]+gauss(0,6);}
 var p={id:newPid(),sei:nm.sei,mei:nm.mei,nat:nm.nat||'JPN',age:age,pos:pos,ab:ab};
 var d=target-ovrAt(p,pos);
 for(i=0;i<ABK.length;i++){k=ABK[i];ab[k]=clamp(Math.round(ab[k]+d),1,99);}
 if(pos==='GK')ab.off=clamp(Math.round(ab.off),1,45);
 /* 利き足・適応力・ポジション適性 */
 p.foot=genFoot(pos);p.adapt=Math.round(clamp(gauss(1,.35),.35,1.9)*100)/100;p.ax={};
 p.apt=genApt(pos,p.foot);delete p.sub;
 /* 伸びしろ */
 var o=ovrAt(p,pos),room;
 if(age<=18)room=gauss(14,6);else if(age<=20)room=gauss(10,5);else if(age<=22)room=gauss(6,4);else if(age<=25)room=gauss(3,3);else room=gauss(.5,1.5);
 p.pot=Math.round(clamp(o+Math.max(0,room),o,97));
 p.club=null;p.sal=salFor(o);p.yrs=ri(1,3);p.loan=null;
 p.cond=100;p.inj=0;p.st=newSt();p.car={ap:0,g:0,a:0};p.hist=[];
 return p;
}
function newSt(){return {ap:0,g:0,a:0,cap:0,cg:0,mins:0,rt:0,yc:0,rc:0};}
function randPos(){return wpick(POS,function(q){return {GK:3,CB:6,LSB:2.5,RSB:2.5,DMF:3.5,CMF:4.5,LMF:1.5,RMF:1.5,OMF:3,LWG:1.75,RWG:1.75,ST:2.5,CF:3}[q];});}
function randAge(){return clamp(Math.round(gauss(25,4.3)),18,36);}
function ageAdj(age){return age<=19?-7:age<=21?-4:age<=23?-1.5:age<=30?0:age<=32?-1.5:-4;}

/* ---------- 監督 ---------- */
var _cid=1;
function makeCoach(lv,opt){
 opt=opt||{};
 var fr=rnd()<.15,nm=fr?foreignName():jpName();
 var c={id:'c'+(_cid++),sei:nm.sei,mei:nm.mei,nat:nm.nat||'JPN',age:ri(38,66),
  form:opt.form||pick(FORM_KEYS),style:opt.style||pick(STYLE_KEYS),
  tac:clamp(Math.round(gauss(lv,8)),30,95),dev:clamp(Math.round(gauss(lv-2,10)),25,95),
  flex:clamp(Math.round(gauss(55,18)),15,95),
  club:null,yrs:ri(1,3),fam:{}};
 c.sal=Math.round(coachWorth(c)/10)*10;

}
function cname(c){if(c.nat==='JPN')return c.sei+' '+c.mei;var F=FOREIGN[c.nat];return F&&F.sf?c.sei+'・'+c.mei:c.mei+'・'+c.sei;}
/* 実際に使う布陣・戦い方（GMの指示があればそれ、なければ監督の好み） */
function formOf(cl){var d=cl.dir;if(d&&d.form)return d.form;return cl.coach?cl.coach.form:'4-4-2';}
function styleOf(cl){var d=cl.dir;if(d&&d.style)return d.style;return cl.coach?cl.coach.style:'balance';}
/* 監督がその布陣・戦い方をどれだけ使いこなせるか（0.5〜1） */
function famOf(cl){
 var c=cl.coach;if(!c)return .8;
 var f=formOf(cl),fam=f===c.form?1:((c.fam&&c.fam[f])||(.55+.25*c.flex/100));

/* ---------- スタメン選考（監督が行う） ---------- */
function condF(p){return .8+.2*(p.cond/100);}
/* q: 大会への本気度(0..1)。低いほど控え・若手を使う */
function avail(p,lg){return p.inj<=0&&!(lg&&p.sus>0);}
function pickXI(cl,players,q,flimit,lg){
 var F=FORMS[formOf(cl)],slots=F.s,ns=slots.length;
 var av=[],i,s;
 for(i=0;i<players.length;i++)if(avail(players[i],lg))av.push(players[i]);
 var maxAp=1;for(i=0;i<av.length;i++){var t=av[i].st.ap+av[i].st.cap;if(t>maxAp)maxAp=t;}
 if(q==null)q=1;
 var yb=cl.policy&&cl.policy.youth||0,mine=cl.id===S.me;
 /* 選手×ポジションの評価を先に計算しておく */
 var posList=[],posIdx={};
 for(s=0;s<ns;s++){var ps=slots[s][0];if(posIdx[ps]==null){posIdx[ps]=posList.length;posList.push(ps);}}
 var V=new Array(av.length),FR=new Array(av.length);
 for(i=0;i<av.length;i++){
  var p=av[i],row=new Array(posList.length),cf=condF(p),m=1;
  if(q<1)m*=1-(1-q)*.35*((p.st.ap+p.st.cap)/maxAp);
  if(yb&&p.age<=22)m*=1+yb*.04;
  /* GMの起用方針：先発で使う／途中出場を増やす（先発は控えめ）／控えに回す */
  if(mine&&p.use)m*=USE_XI[p.use]||1;
  for(var k=0;k<posList.length;k++){var pos=posList[k];row[k]=(pos!=='GK'&&p.pos==='GK')?-1:effAt(p,pos)*placeF(p,pos)*cf*m;}
  V[i]=row;FR[i]=countsF(p,cl.tier);
 }
 var used=new Array(av.length),xi=new Array(ns),nf=0;
 for(var n=0;n<ns;n++){
  var bv=-1,bi=-1,bs=-1;
  for(s=0;s<ns;s++){
   if(xi[s])continue;
   var pk=posIdx[slots[s][0]];
   for(i=0;i<av.length;i++){
    if(used[i]||(FR[i]&&nf>=flimit))continue;
    var v=V[i][pk];if(v>bv){bv=v;bi=i;bs=s;}
   }
  }
  if(bi<0){
   for(s=0;s<ns;s++)if(!xi[s]){bs=s;break;}
   var gp=makePlayer(slots[bs][0],35,30);gp.ghost=1;xi[bs]=gp;continue;
  }
  xi[bs]=av[bi];used[bi]=1;if(FR[bi])nf++;
 }
 return xi;
}
/* 起用方針ごとの先発選考の重み（自クラブのみ） */
var USE_XI={start:1.14,sub:.9,bench:.78};
/* ベンチ入り（試合エントリーは20人＝先発11＋控え9。GKを1人含める）。途中出場を増やす選手は優先してベンチに入れる */
function pickBench(cl,players,xi,flimit,lg){
 var inXI={},nf=0,mine=cl.id===S.me;xi.forEach(function(p){if(p&&!p.ghost){inXI[p.id]=1;if(countsF(p,cl.tier))nf++;}});
 function bv(p){return ovr(p)*condF(p)+(mine&&p.use==='sub'?1000:mine&&p.use==='start'?500:0);}
 var av=players.filter(function(p){return avail(p,lg)&&!inXI[p.id];}).sort(function(a,b){return bv(b)-bv(a);});
 var out=[],gk=av.filter(function(p){return p.pos==='GK';})[0];
 if(gk){out.push(gk);if(countsF(gk,cl.tier))nf++;}
 for(var i=0;i<av.length&&out.length<9;i++){var p=av[i];if(p===gk||p.pos==='GK')continue;if(countsF(p,cl.tier)){if(nf>=flimit)continue;nf++;}out.push(p);}
 return out;
}

/* ---------- 試合エンジン ---------- */
function zw(x){var d=x-.5,a=Math.abs(d),s=a>=.35?1:a<=.1?0:(a-.1)/.25;return d<0?[s,1-s,0]:[0,1-s,s];}
function atkR(p,pos){var a=p.ab;switch(bpos(pos)){
 case 'CF':return .45*a.off+.25*a.pow+.15*a.tec+.15*a.spd;
 case 'ST':return .4*a.off+.25*a.tec+.2*a.spd+.15*a.pow;
 case 'WG':case 'SMF':case 'SB':return .3*a.off+.35*a.spd+.25*a.tec+.1*a.pow;
 case 'CB':return .5*a.pow+.3*a.off+.2*a.tec;
 case 'GK':return 0;
 default:return .35*a.off+.45*a.tec+.1*a.spd+.1*a.pow;}}
function defR(p,pos){var a=p.ab;switch(bpos(pos)){
 case 'CB':return .5*a.def+.3*a.pow+.2*a.spd;
 case 'SB':case 'SMF':return .45*a.def+.35*a.spd+.2*a.sta;
 case 'DMF':case 'CMF':return .5*a.def+.25*a.sta+.25*a.pow;
 case 'GK':return 0;
 default:return .4*a.def+.4*a.sta+.2*a.spd;}}
function midR(p){var a=p.ab;return .45*a.tec+.25*a.sta+.1*a.off+.2*a.def;}
function gkR(p){var a=p.ab;return .5*a.def+.2*a.tec+.15*a.pow+.15*a.spd;}

/* チームの戦力を、左・中央・右の攻撃/守備と中盤支配に集約する */
function sheet(cl,xi){
 var F=FORMS[formOf(cl)],sl=F.s,A=[0,0,0],D=[0,0,0],M=0,gk=50,fw=[],setA=[],tec=0,cs=0,off=[];
 for(var i=0;i<sl.length;i++){
  var pos=sl[i][0],p=xi[i],f=fitOf(p,pos)*condF(p),w=zw(sl[i][1]),R=ROLE[pos];
  cs+=p.cond==null?100:p.cond;
  if(!p.ghost&&p.id&&aptOf(p,pos)<3)off.push([p.id,pos,aptOf(p,pos)]);
  if(pos==='GK'){gk=gkR(p)*f;M+=R.m*midR(p)*f;continue;}
  var a=atkR(p,pos)*f,d=defR(p,pos)*f;
  for(var z=0;z<3;z++){A[z]+=R.a*a*w[z];D[z]+=R.d*d*w[z];}
  M+=R.m*midR(p)*f;
  if(R.a>=.6)fw.push(a);
  setA.push(p.ab.pow*f);tec=Math.max(tec,p.ab.tec*f);
 }

function acleSchedule(ids){
 /* 8節：同じ国どうしは当たらず、同じ相手とは1回だけ（バックトラックで組む） */
 for(var tries=0;tries<60;tries++){
  var met={},rounds=[],homeN={},ok=true;
  ids.forEach(function(id){met[id]={};homeN[id]=0;});
  for(var r=0;r<8;r++){
   var rd=matchRound(ids,met,0);
   if(!rd){ok=false;break;}
   rd=rd.map(function(m){var a=m[0],b=m[1];met[a][b]=met[b][a]=1;if(homeN[a]<=homeN[b]){homeN[a]++;return [a,b];}homeN[b]++;return [b,a];});
   rounds.push(rd);
  }

 }

}
function matchRound(ids,met,steps){
 var pool=shuffle(ids.slice()),used={},out=[],cnt=0;
 function rec(){
  if(++cnt>4000)return false;
  var a=null;for(var i=0;i<pool.length;i++)if(!used[pool[i]]){a=pool[i];break;}
  if(a===null)return true;
  used[a]=1;
  for(var j=0;j<pool.length;j++){var b=pool[j];if(used[b]||met[a][b]||natOfTeam(a)===natOfTeam(b))continue;used[b]=1;out.push([a,b]);if(rec())return true;out.pop();used[b]=0;}
  used[a]=0;return false;
 }
 return rec()?out:null;
}

   var ah=pr.g1[1]+x.hg,aa=pr.g1[0]+x.ag,win=x.pk?(x.pk.h>x.pk.a?h:a):(ah>aa?h:a);pr.w=win.id;w.push(win.id);});

  case 'emp':{var E=S.cups.emp;if(!E||E.champ)return false;var al=E.alive.indexOf(me)>=0;
   if(e.r==='R1')return al&&E.jl.indexOf(me)<0;

   return al;}

 *  ・毎年続けられる額：年間の収入見込みから人件費以外の費用を引いた額（収入の62%まで）

/* ---------- 選手の能力の見え方（スカウト網による） ---------- */
function hashN(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;}
function seeAb(p,k){
 if(p.club===S.me||(p.loan&&p.loan.from===S.me))return p.ab[k];
 var lv=myClub().fac.scout,err=(5-lv)*2.2;

}
var _seeF={};
function seeF(p,k){var a=_seeF[p.id];if(!a){a={};ABK.forEach(function(x){a[x]=((Math.abs(hashN(p.id+x))%201)-100)/100;});_seeF[p.id]=a;}return a[k];}
function seeOvr(p){var w=OW[p.pos],s=0;ABK.forEach(function(k){s+=w[k]*seeAb(p,k);});return s;}
function seePot(p){

 var lv=myClub().fac.scout,f=((Math.abs(hashN(p.id+'pot'))%201)-100)/100;

/* ---------- 愛着度（クラブへの思い入れ） ----------
 * 0〜100。毎月25日に、出場時間（期待に対してどれだけ出られたか）・口約束が守られているか・在籍年数・チームの成績で上下し、
 * ゆっくり60に戻ろうとする。30を下回ると出場機会を求めて直談判に来て、15を下回ると移籍やレンタル移籍を志願する */
function attOf(p){if(p.att==null)p.att=p.youth?78:p.loan&&p.loan.from!==S.me?55:62;return p.att;}
function attLabel(a){return a>=75?'高い':a>=50?'ふつう':a>=30?'低め':'不満';}
function attFactors(p){
 var mc=myClub(),mp=Math.max(1,mc.mp),ranked=roster(mc).slice().sort(function(a,b){return ovr(b)-ovr(a);}),i=ranked.indexOf(p);
 var exp=i<11?.68:i<16?.35:i<22?.15:.05;if(p.age<=20)exp*=.6;else if(p.age>=33)exp*=.8;
 var share=Math.min(1,(p.st.mins||0)/(mp*90));
 var L=S.lg[mc.tier],n=L?L.ids.length:20,rk=mc.mp?rankOf(S.me):0,team=rk&&rk<=Math.ceil(n/4)?1:rk&&rk>n*.75?-1:0;
 var ten=S.year-(p.since||mc.founded||2026);
 return {share:share,exp:exp,play:(share-exp)*14,promise:p.promise===S.year&&share<.35&&mc.mp>=6?-3:0,ten:ten,tenure:ten>=4?1:ten>=2?.6:0,team:team*.8,cap:capAttD(p)};
}
function attMonth(){
 var mc=myClub();if(mc.mp<2||S.seasonDone)return;
 roster(mc).forEach(function(p){
  var a=attOf(p),F=attFactors(p),d=F.play+F.promise+F.tenure+F.team+F.cap;
  if(p.pers==='loyal')d=d>0?d*1.2:d*.6;else if(p.pers==='ambition')d=d>0?d*.9:d*1.3;else if(p.pers==='easy')d*=.7;
  if(p.inj>0&&d<0)d*=.3;
  d+=(60-a)*.03;
  p.att=clamp(Math.round((a+d)*10)/10,0,100);
 });
}
/* 直談判：出場機会がほしい（30未満）／移籍を志願（15未満）。1週間に1人まで、同じ選手は1シーズンに2回まで。
 * すでに放出・レンタルの候補に載っている選手や、移籍の意思を伝えたあとの選手は来ない */
function attWeek(){
 var mc=myClub();if(mc.mp<4||S.seasonDone)return;
 var c=roster(mc).filter(function(p){
  if(p.loan&&p.loan.from!==S.me)return false;
  if(p.pleaD&&S.day-p.pleaD<63)return false;
  if(p.list||p.loanList||p.wantOut===S.year)return false;
  if(p.pleaN&&p.pleaN.y===S.year&&p.pleaN.n>=2)return false;
  if(S.inbox.some(function(m){return m.type==='offer'&&!m.done&&m.pid===p.id;}))return false;
  return attOf(p)<30;
 }).sort(function(a,b){return a.att-b.att;})[0];
 if(!c)return;
 var lv=c.att<15?2:1,sh=Math.round(attFactors(c).share*100),broken=c.promise===S.year;c.pleaD=S.day;
 c.pleaN=c.pleaN&&c.pleaN.y===S.year?{y:S.year,n:c.pleaN.n+1}:{y:S.year,n:1};
 if(lv===2)c.wantOut=S.year;
 var want=lv===2?(c.age<=23&&ovr(c)<myLevel()?'loan':'move'):'play';
 inbox({type:'offer',kind:'plea',lv:lv,want:want,pid:c.id,exp:S.day+10,title:pname(c)+(lv===2?'が'+(want==='loan'?'レンタル移籍':'移籍')+'を志願しています':'が面談を求めています'),
  body:(lv===2?(broken?'「出番を増やすと約束してくれましたよね。でも、何も変わりませんでした。':'「このままここにいても、サッカー選手として先がありません。')+(want==='loan'?'試合に出られるクラブへ、期限付きでも行かせてください」':'ほかのクラブで勝負させてください」')
   :broken?pick(['「約束してもらったのに、まだ出番が増えていません。どうなっているんですか」','「あの約束は、まだ生きていますか。正直、不安になっています」'])
   :pick(['「もっと試合に出たいです。自分のどこが足りないのか教えてください」','「練習では手応えがあります。チャンスをもらえませんか」','「ベンチで見ているだけのシーズンにはしたくありません。もっと試合に出たいんです」','「このままだと、自分の居場所がわからなくなりそうです」']))+'（今季の出場時間 '+sh+'%）'});
}
var PLEA_OPT={promise:'出場機会を約束する',loan:'レンタル移籍を認める',list:'移籍を認める（放出リストへ）',wait:'今は我慢してほしい'};
function applyPlea(m,c){

 var a=attOf(p),lv=m.lv||1,msg='';
 if(c==='promise'){
  var ok=lv===1||rnd()<(p.pers==='loyal'?.7:p.pers==='ambition'?.3:.5);
  p.promise=S.year;if(!p.use||p.use==='bench')p.use=ovr(p)>=myLevel()?'start':'sub';
  if(ok){p.att=clamp(a+(lv===2?18:12),0,100);p.wantOut=0;msg=pname(p)+'「……わかりました。その言葉を信じて、もう一度頑張ります」';}
  else{p.att=clamp(a+3,0,100);msg=pname(p)+'「言葉だけでは、もう信じられません」。移籍の意思は変わらないようです';}
 }else if(c==='loan'){p.loanList=1;p.list=0;p.att=clamp(a+(lv===2?14:10),0,100);if(p.wantOut)p.wantOut=0;msg=pname(p)+'をレンタル移籍の候補に載せました'+(S.window?'':'（次の移籍期間に打診が届きます）');}
 else if(c==='list'){p.list=1;p.loanList=0;p.att=clamp(a+8,0,100);msg=pname(p)+'を放出リストに載せました。本人は納得したようです';}
 else{p.att=clamp(a-(p.pers==='loyal'?2:6),0,100);msg=pname(p)+'「……そうですか」。納得はしていないようです';}
 m.done=PLEA_OPT[c]||'返事をした';

}

/* 移籍を志願している、または愛着がひどく低い選手は契約を延長しない */

/* ---------- キャプテン ----------
 * 統率力（0〜100）＝生まれ持ったリーダーシップと性格＋年齢＋在籍年数＋主力かどうか＋クラブへの愛着＋通算出場＋キャプテン経験。
 * 効果は3つ：試合でのまとまり（ピッチにいるとチームの総合力が最大2%ほど上下）、チーム全体の愛着の伸び、警告の出やすさ。
 * 性格で効き方が変わる。シーズン途中の交代や、キャプテンの移籍・退団は、しばらくチームを動揺させる */
var CAP_PERS={
 loyal:{n:'チームの愛着が高まりやすい',att:1.5,m:1,card:.95},
 ambition:{n:'試合でチームを強く引っ張る。成績が悪いと周りとぶつかる',att:.6,m:1.35,card:1.05},
 stable:{n:'警告が減り、チームが落ち着く',att:1,m:1,card:.85},
 easy:{n:'雰囲気が明るく、新加入の選手がなじみやすい',att:1.1,m:.85,card:1.05,newc:1},
 money:{n:'キャプテンとしての影響は小さめ',att:.6,m:.7,card:1}
};
function leadBase(p){persOf(p);return 32+Math.abs(hashN(p.id+'lead'))%44+({loyal:8,stable:5,ambition:4,easy:-2,money:-8}[p.pers]||0);}
function capFit(p){
 var mc=myClub(),a=p.age,ten=S.year-(p.since||mc.founded||2026),share=(p.st.ap+p.st.cap)/Math.max(1,mc.mp);
 var v=leadBase(p)+Math.min(ten,6)*3+(a>=31?9:a>=28?6:a<=22?-12:a<=25?-4:0)+(mc.mp>=6?(share>=.5?6:share<.2?-12:0):(ovr(p)>=myLevel()?4:-4))+(attOf(p)-60)*.2+Math.min(8,((p.car&&p.car.ap)||0)/40);
 if(S.cap&&S.cap.id===p.id)v+=Math.min(9,(S.cap.yrs||0)*3);
 if(p.loan&&p.loan.from!==S.me)v-=15;
 return clamp(Math.round(v),0,100);
}
function capGrade(v){return v>=80?'A':v>=68?'B':v>=55?'C':v>=42?'D':'E';}
function capOf(){var c=S.cap;if(!c)return null;var p=S.P[c.id];return p&&p.club===S.me?p:null;}
function capPers(p){return CAP_PERS[persOf(p)]||CAP_PERS.money;}
/* チームのまとまり（-1.2〜+1）。統率力55がちょうど0 */
function capCoh(){var p=capOf();return p?clamp((capFit(p)-55)/45,-1.2,1):0;}
function capMidSeason(){return myClub().mp>0&&!S.seasonDone;}
function capShocked(){return !!(S.capShock&&S.day<S.capShock);}
/* 試合：キャプテンがピッチにいるとまとまりが総合力に出る（ベンチ外でも少しは効く）。交代や退団の直後は動揺で少し落ちる */
function capMatchF(cl,xi){
 if(!cl||cl.id!==S.me)return 1;
 var f=1,p=capOf();
 if(p){var on=xi.some(function(q){return q&&q.id===p.id;});f+=.02*capCoh()*capPers(p).m*(on?1:.4);}
 if(capShocked())f*=.975;
 return f;
}
function capCardF(cl,on){if(!cl||cl.id!==S.me)return 1;var p=capOf();if(!p||!on.some(function(q){return q&&q.id===p.id;}))return 1;return capPers(p).card;}
/* 毎月の愛着への影響：キャプテン本人は誇りで上がり、ほかの選手はまとまりしだいで上下する */
function capAttD(p){
 var c=capOf();if(!c||p.club!==S.me)return 0;if(c.id===p.id)return 1;
 var P=capPers(c),v=.5*capCoh()*P.att;
 if(P.newc&&p.since===S.year)v+=.5;
 if(persOf(c)==='ambition'){var L=S.lg[myClub().tier],n=L?L.ids.length:20,rk=myClub().mp?rankOf(S.me):0;if(rk&&rk>n*.66)v-=.5;}
 return Math.round(v*10)/10;
}
function capCands(){return roster(myClub()).filter(function(p){return !p.ghost;}).map(function(p){return {p:p,v:capFit(p)};}).sort(function(a,b){return b.v-a.v;});}
/* 任命。シーズン途中の交代はチームを動揺させ、外された前キャプテンの愛着が大きく下がる */
function appointCaptain(pid,auto){
 var p=S.P[pid],mc=myClub();if(!p||p.club!==S.me)return {ok:false,msg:'対象外の選手です'};
 var prev=capOf(),mid=capMidSeason()&&!auto;
 if(prev&&prev.id===p.id){S.cap.y=S.year;S.cap.n=pname(p);return {ok:true,msg:pname(p)+'に今季もキャプテンを任せます'};}
 var msg=pname(p)+'をキャプテンに任命しました';
 if(prev){var hit=mid?({ambition:20,loyal:10,easy:6}[persOf(prev)]||15):5;prev.att=clamp(attOf(prev)-hit,0,100);if(mid)msg+='。'+pname(prev)+'は複雑な表情です';}
 if(mid){S.capShock=S.day+(prev&&capFit(p)>=capFit(prev)+15?14:21);roster(mc).forEach(function(q){if(q!==p&&q!==prev)q.att=clamp(attOf(q)-2,0,100);});msg+='（シーズン途中の交代で、チームに少し動揺があります）';}
 p.att=clamp(attOf(p)+8,0,100);
 S.cap={id:p.id,n:pname(p),y:S.year,since:S.day,yrs:0};
 addNews(pname(p)+'がキャプテンに就任'+(auto?'（監督の指名）':mid?'（シーズン途中の交代）':''),1);
 return {ok:true,msg:msg};
}
/* 毎週：キャプテンがチームを離れていないか。開幕後まで決まっていなければ監督が決める */

   inbox({type:'info',title:'キャプテンがいなくなりました',body:nm+'がチームを離れました。しばらくチームは落ち着かないでしょう。「チーム＞選手」から新しいキャプテンを決めてください。'});}

/* シーズン開始：前年からのキャプテンは経験を1年積む（今季も任せるかはGMが決める） */

/* ---------- シーズン総括（シェア用の画像のもと） ----------
 * 基本フォーメーション：リーグ戦でいちばん多く使った布陣に、各ポジションで先発した回数の多い選手を当てはめる。
 * 主な控え：先発11人以外で、リーグ戦の出場時間が長い7人。シーズン終了時点で在籍している選手から選ぶ */
function luSnap(p,pos){return {id:p.id,n:pname(p),sei:p.sei,mei:p.mei,nat:natOf(p),age:p.age,pos:pos||p.pos,ap:p.st.ap,gs:p.st.gs||0,g:p.st.g,c:S.cap&&S.cap.id===p.id?1:0};}
function seasonLineup(){
 var mc=myClub(),fu=S.fu&&S.fu.y===S.year?S.fu.f:null,form=formOf(mc),best=0,k;
 if(fu)for(k in fu)if(fu[k]>best&&FORMS[k]){best=fu[k];form=k;}
 var ps=roster(mc).filter(function(p){return !p.ghost&&!(p.loan&&p.loan.from===S.me&&p.club!==S.me);});
 var slots=FORMS[form].s,xi=new Array(slots.length),used={};
 function sc(p,pos){
  if((pos==='GK')!==(p.pos==='GK'))return -1;
  var pp=p.st.pp||{},g=pp[pos]||0,nr=0,q;for(q in pp)if(q!==pos&&nearPos(q,pos))nr+=pp[q];
  return g*100+nr*30+(p.st.gs||0)*4+(p.st.mins||0)/90+(p.pos===pos?6:nearPos(p.pos,pos)?2:0)+ovr(p)*.02;
 }
 for(var n=0;n<slots.length;n++){
  var bs=-1,bp=null,bv=-1;
  for(var s=0;s<slots.length;s++){if(xi[s])continue;for(var i=0;i<ps.length;i++){var p=ps[i];if(used[p.id])continue;var v=sc(p,slots[s][0]);if(v>bv){bv=v;bs=s;bp=p;}}}
  if(!bp)break;xi[bs]=bp;used[bp.id]=1;
 }
 var bench=ps.filter(function(p){return !used[p.id];}).sort(function(a,b){return (b.st.mins||0)-(a.st.mins||0)||ovr(b)-ovr(a);}).slice(0,7);
 var top=ps.slice().sort(function(a,b){return b.st.g-a.st.g||(b.st.a||0)-(a.st.a||0);})[0];
 var ace=ps.filter(function(p){return p.st.ap>=Math.max(5,Math.round((mc.mp||0)*.3));}).sort(function(a,b){return b.st.rt/b.st.ap-a.st.rt/a.st.ap;})[0];
 return {form:form,xi:xi.map(function(p,i){return p?luSnap(p,slots[i][0]):null;}),bench:bench.map(function(p){return luSnap(p);}),
  top:top&&top.st.g>0?{n:pname(top),g:top.st.g}:null,cap:capOf()?pname(capOf()):'',ace:ace?{n:pname(ace),r:Math.round(ace.st.rt/ace.st.ap*100)/100}:null,coach:mc.coach?cname(mc.coach):''};
}

/* ---------- 契約更改 ---------- */
function demand(p){
 var t=myClub().tier,o=ovr(p),base=Math.max(MIN_SAL[t],salFor(o)*tierPay(t));
 var share=p.st.ap+p.st.cap,mp=Math.max(1,myClub().mp);
 var star=share/mp>.6?1.1:1;
 var age=p.age>=32?.8:p.age<=21?.85:1;
 var a=attOf(p),am=a>=75?.94:a<35?1.15:1;
 return Math.round(Math.max(MIN_SAL[t],base*star*age*am,p.sal*.9)/10)*10;
}

}

/* 移籍市場のリスト：各クラブの放出リスト・レンタル可能な若手・フリーの選手に、スカウトの推薦を加える（毎週月曜に更新）
 * 自クラブのカテゴリに見合う選手を中心に並べる：能力が近いこと、払える年俸であること、カテゴリが近いクラブの選手であること */
function refreshMarket(){
 var mc=myClub(),lv=myLevel(),sc=mc.fac.scout,ti=tierIdx(mc),list=[],seen={},all=[];
 for(var id in S.P){var p=S.P[id];if(p.club===S.me||p.ghost||p.prospect||p.loan)continue;if(p.club&&!S.clubs[p.club])continue;if(p.club&&movedThisSeason(p))continue;all.push(p);}
 var so={};all.forEach(function(p){so[p.id]=seeOvr(p);});
 var cap=Math.max(MIN_SAL[mc.tier]*3,payCap()*.1);
 function near(p,a,b){var o=so[p.id];return o>=lv-a&&o<=lv+b;}
 function fit(p,share){
  var o=so[p.id],s=-Math.abs(o-(lv+1.5))*1.1;
  var w=wantSal(p)*(share||1);if(w>cap)s-=(w/cap-1)*7;
  var ct=p.club?tierIdx(S.clubs[p.club]):ti;s-=Math.max(0,Math.abs(ct-ti)-1)*5;
  return s+rnd()*3;
 }
 function top(arr,n,share){var sc2={};arr.forEach(function(p){sc2[p.id]=fit(p,share);});return arr.sort(function(a,b){return sc2[b.id]-sc2[a.id];}).slice(0,n);}
 function add(p,t){if(!seen[p.id]){seen[p.id]=1;list.push({id:p.id,t:t});}}
 top(all.filter(function(p){return p.club&&p.list&&near(p,10,9);}),36).forEach(function(p){add(p,'list');});
 top(all.filter(function(p){return p.club&&p.loanOk&&tierIdx(S.clubs[p.club])<=ti&&near(p,8,10);}),12,.6).forEach(function(p){add(p,'loan');});
 top(all.filter(function(p){return !p.club&&near(p,12,8);}),24).forEach(function(p){add(p,'free');});
 var picks=all.filter(function(p){return p.club&&!p.list&&near(p,0,8)&&Math.abs(tierIdx(S.clubs[p.club])-ti)<=1;});shuffle(picks);
 picks.slice(0,3+sc*3).forEach(function(p){add(p,'scout');});
 S.mkt={d:S.day,list:list};
}

 var c=S.clubs[p.club],v=valueOf(p),mp=Math.max(1,c.mp),share=(p.st.ap+p.st.cap)/mp;
 var imp=p.list?.8:share>.6?1.45:share>.3?1.15:.9;
 if(!p.list&&c.pol==='sell')imp*=1.1;
 if((c.money||0)<0)imp*=.88;

 return Math.round(v*imp/10)*10;

 req*=1+.18*down;
 if(!p.club)req=Math.max(salFor(ovr(p))*tierPay(mc.tier)*.9,p.sal*.85);

function negClose(N,ok){
 N.done=true;N.ok=false;var mc=myClub(),p=N.p;
 if(!ok){
  if(N.kind==='renew'&&p){p.renewBlock=S.day+7;p.renewHard=(p.renewHard||0)+1;}

  if(N.kind==='rookie'&&N.e&&N.e.st==='未定'){var br=bestRival(N.e,p);N.e.st=br?'他クラブへ':'交渉決裂';N.e.to=br?br.c:null;}
  if((N.kind==='free'||N.kind==='buy')&&p)p_block(p);
  if(N.kind==='sell'){var m=S.inbox.filter(function(x){return x.id===N.id;})[0];if(m)m.done='交渉決裂';}
  negLine(N,'sys','交渉は不成立に終わりました。'+(N.kind==='renew'&&p?'再交渉は'+fmtD(p.renewBlock)+'から（相手の要求は上がります）。':''));return N;
 }
 var r;
 if(N.kind==='renew'){p.yrs=p.yrs+N.yrs;p.sal=N.sal;p.renewNo=0;p.renewed=1;addNews(pname(p)+'と契約を更新（'+N.yrs+'年・年俸'+money(N.sal)+'）');r={ok:true};}
 else if(N.kind==='free'||N.kind==='buy'){r=completeSign(p,N.fee||0,N.sal,N.yrs);}
 else if(N.kind==='loan'){r=completeLoan(p,N.share,N.opt);}
 else if(N.kind==='coach'){r=offerCoach(N.id,N.sal,N.yrs,true);}
 else if(N.kind==='coachx'){r=extendCoach(N.yrs,N.sal);}
 else if(N.kind==='rookie'){N.e.st='内定';N.e.offer=N.e.offer||{sal:N.sal,yrs:N.yrs};p.sal=N.sal;addNews(rookieJoinNews(p),1);r={ok:true};}

 else negLine(N,'sys',(r&&r.msg)||'手続きができませんでした');

function completeSign(p,fee,sal,yrs){
 var mc=myClub();
 if(squadSize()>=40)return {ok:false,msg:'登録上限（40人）に達しています'};
 if(foreignBlocked(p))return {ok:false,msg:'JFLでは外国籍選手の登録は5人までです'};
 if(S.fin.cash<fee)return {ok:false,msg:'資金が足りません'};
 var from=p.club?S.clubs[p.club]:null;
 if(from){ledger('exp','trans',fee);from.money+=fee;leaveClub(p);}
 joinClub(p,mc,yrs,sal);p.st=newSt();markMoved(p);
 addNews(pname(p)+'が'+(from?from.short+'から完全移籍で':'フリーで')+'加入'+(fee?'（移籍金'+money(fee)+'）':''),1);
 return {ok:true,msg:pname(p)+'の獲得が決まりました'};
}
function completeLoan(p,share,opt){
 var mc=myClub(),from=S.clubs[p.club];
 if(squadSize()>=40)return {ok:false,msg:'登録上限（40人）に達しています'};
 if(foreignBlocked(p))return {ok:false,msg:'JFLでは外国籍選手の登録は5人までです'};
 if(!budgetOK(p.sal*share))return {ok:false,msg:budgetMsg()};
 if(opt&&S.fin.cash<opt.fee)return {ok:false,msg:'レンタル料を払う資金が足りません'};
 if(opt){ledger('exp','trans',opt.fee);from.money=(from.money||0)+opt.fee;}
 leaveClub(p);p.club=mc.id;mc.pl.push(p.id);p.loan={from:from.id,share:share};markMoved(p);
 if(opt)p.loan.opt={price:opt.price,fee:opt.fee,yrs:opt.yrs,y:S.year};
 addNews(pname(p)+'が'+from.short+'から期限付き移籍で加入'+(opt?'（買取オプション付き・レンタル料'+money(opt.fee)+'）':''),1);
 return {ok:true,msg:pname(p)+'のレンタル加入が決まりました（今季終了まで）'};
}

/* ---- 06d_ai.js ---- */
/* ============ AIクラブの経営・編成 ============
 * 各クラブは「運営方針」「人件費予算」「手元資金」を持ち、毎週（移籍期間中）／4週ごと（期間外）に
 * 選手リストを見直す。余剰の選手は放出リストへ、出番のない若手はレンタル可に。
 * 足りないポジションは、他クラブの放出リスト・フリーの選手から補強する。 */
var AI_POL={win:{n:'強化型',d:'勝つために積極的に補強する'},youth:{n:'育成型',d:'若手を育てて起用する'},sell:{n:'売却型',d:'育てた選手を売って経営を回す'},stable:{n:'堅実型',d:'身の丈に合った補強で着実に'}};
function aiPay(c){return sum(roster(c),function(p){return p.loan&&p.loan.from!==c.id?p.sal*(p.loan.share||.5):p.sal;});}
function usageOf(p,c){return (p.st.ap+p.st.cap)/Math.max(1,c.mp);}
function aiInit(c){
 if(!c||c.id===S.me||c.pol)return;
 var r=rnd(),st=c.st||3;
 c.pol=c.corp?'stable':st>=4?(r<.5?'win':r<.75?'stable':r<.9?'youth':'sell'):st<=2?(r<.35?'youth':r<.6?'sell':r<.9?'stable':'win'):(r<.3?'stable':r<.55?'youth':r<.75?'win':'sell');
 var pay=aiPay(c);
 c.bud=Math.round(pay*clamp(gauss(1.08,.05),.98,1.2)/10)*10;
 c.money=Math.max(c.money||0,Math.round(c.bud*clamp(gauss(.28,.1),.08,.6)/10)*10);
 c.policy=c.policy||{cup:1,youth:0};c.policy.youth=c.pol==='youth'?1:0;
}
function aiFinLabel(c){aiInit(c);var pay=aiPay(c),m=c.money||0;if(m<0||pay>c.bud*1.1)return '苦しい';if(m>c.bud*.4)return '潤沢';return '健全';}
/* AIクラブ同士の移籍金 */
function aiFee(p,from){var u=usageOf(p,from),m=p.list?.8:u>.6?1.4:u>.3?1.1:.95;if(from.pol==='sell'&&!p.list)m*=1.1;if(p.yrs<=1)m*=.7;return Math.round(valueOf(p)*m/10)*10;}
function aiManage(c,inWin){
 aiInit(c);
 var ps=roster(c).filter(function(p){return !(p.loan&&p.loan.from!==c.id);}),n=c.pl.length,lv=clubLevel(c),pay=aiPay(c),early=c.mp<4;
 var rank=ps.slice().sort(function(a,b){function v(p){return ovr(p)-(p.age>30?(p.age-30)*1.5:0);}return v(a)-v(b);});
 var depth=ps.slice().sort(function(a,b){return ovr(b)-ovr(a);});
 ps.forEach(function(p){
  var di=depth.indexOf(p),u=early?(di<11?.8:di<18?.35:.1):usageOf(p,c),o=ovr(p),L=0;
  if(n>30&&rank.indexOf(p)<Math.min(5,n-28)&&u<.3)L=1;
  if(pay>c.bud*1.05&&p.sal>=pay/Math.max(1,n)*1.6&&u<.45)L=1;
  if(p.age>=33&&u<.2&&o<lv)L=1;
  if(c.pol==='sell'&&p.age<=25&&o>=lv+3&&p.yrs>=1&&rnd()<.03)L=1;
  if(!L&&p.list&&p.listD&&S.day-p.listD<90)L=1;
  if(L&&!p.list){p.list=1;p.listD=S.day;}else if(!L&&p.list){p.list=0;p.listD=0;}
  p.loanOk=(p.age<=22&&u<.25&&o<lv+2&&!p.loan)?1:0;
 });
 if(inWin&&n<34&&(n<27||(c.pol==='win'&&(c.money||0)>c.bud*.25&&rnd()<.25)||rnd()<.1))aiBuy(c,lv,pay);
 if(!S.regClosed&&c.pl.length<26)aiSignFree(c,lv);
}
function aiBuy(c,lv,pay){
 var pos=posNeed(c),best=null,bs=-1e9;
 for(var id in S.P){
  var p=S.P[id];if(!p.club||p.club===c.id||p.club===S.me||p.ghost||p.prospect||p.loan||p.mvY===S.year)continue;
  if(bpos(p.pos)!==bpos(pos))continue;
  var o=ovr(p);if(o<lv-1||o>lv+7)continue;
  var from=S.clubs[p.club];if(!from)continue;
  var fee=aiFee(p,from);if(fee>(c.money||0)*.7)continue;
  if(pay+marketSal(p,c.tier)>c.bud*1.08)continue;
  var sc=o-fee/Math.max(500,c.bud)*20+(p.list?6:0)+(c.pol==='youth'&&p.age<=23?4:0)-(p.age>=31?3:0)+rnd()*3;
  if(sc>bs){bs=sc;best=p;}
 }
 if(!best||(!best.list&&rnd()<.5))return;
 var from=S.clubs[best.club],fee=aiFee(best,from);
 c.money-=fee;from.money=(from.money||0)+fee;leaveClub(best);joinClub(best,c,ri(2,4));best.list=0;best.listD=0;best.loanOk=0;best.mvY=S.year;
 if(fee>=3000||tierIdx(c)<=1||rnd()<.25)addNews(pname(best)+'が'+from.short+'から'+c.short+'へ完全移籍'+(fee?'（移籍金'+money(fee)+'）':''));
}
function aiSignFree(c,lv){
 var pos=posNeed(c),best=null,bv=-1;
 for(var id in S.P){var p=S.P[id];if(p.club||p.ghost||p.prospect)continue;if(bpos(p.pos)!==bpos(pos))continue;var o=ovr(p);if(o<lv-9||o>lv+4)continue;var v=o+rnd()*3;if(v>bv){bv=v;best=p;}}
 if(best){joinClub(best,c,ri(1,2));best.mvY=S.year;}
}
/* 毎週：移籍期間中は全クラブ、期間外は4週に1度ずつ順番に */
function aiWeek(){
 var inWin=!!S.window,wk=Math.floor(S.day/7);
 Object.keys(S.clubs).forEach(function(id){if(id===S.me)return;if(inWin||(Math.abs(hashN(id))+wk)%4===0)aiManage(S.clubs[id],inWin);});
}
/* シーズン末の決算：成績に応じて予算と資金が動く */
function aiSeasonFin(){
 Object.keys(S.clubs).forEach(function(id){
  if(id===S.me)return;var c=S.clubs[id];aiInit(c);
  var r=S.prevRank[id]||10,n=S.lg[c.tier]?S.lg[c.tier].ids.length:20,perf=1-2*(r-1)/Math.max(1,n-1);
  c.money=Math.round((c.money||0)+(c.bud-aiPay(c))*.6+c.bud*(.05+.05*perf));
  c.bud=Math.round(c.bud*(1+.05*perf)*(c.pol==='win'?1.02:1)/10)*10;
 });
}
function aiAfterOffseason(){
 Object.keys(S.clubs).forEach(function(id){if(id===S.me)return;var c=S.clubs[id];aiInit(c);c.bud=Math.max(c.bud,Math.round(aiPay(c)*.98/10)*10);roster(c).forEach(function(p){p.list=0;p.listD=0;p.loanOk=0;});});
}

/* ============ セーブデータの圧縮 ============
 * セーブ1件はJSONで約200万字。端末の保存領域（約500万字）に3枠を収めるため、LZWで約1/10に縮める。
 * 出力は U+0020〜U+801F の文字だけ（サロゲートを含まない）なので、そのまま localStorage に入る。 */
var P2=[];for(var _k=0;_k<48;_k++)P2.push(Math.pow(2,_k));
function lzwPack(str){
 var cap=4096,mask,KW,KC,KV,EW=[],EC=[];
 while(cap<str.length/6)cap*=2;
 function alloc(n){cap=n;mask=n-1;KW=new Int32Array(n).fill(-1);KC=new Uint16Array(n);KV=new Int32Array(n);}
 function slot(w,c){return (Math.imul(w,0x9E3779B1)^Math.imul(c+1,0x85EBCA6B))>>>0&mask;}
 function put(w,c,v){var h=slot(w,c);while(KW[h]!==-1)h=(h+1)&mask;KW[h]=w;KC[h]=c;KV[h]=v;}
 alloc(cap);
 var next=65536,w=-1,bits=17,out=[],acc=0,nb=0;
 function emit(code){acc=acc*P2[bits]+code;nb+=bits;while(nb>=15){nb-=15;var d=P2[nb],v=Math.floor(acc/d);acc-=v*d;out.push(v+32);}}
 for(var i=0;i<str.length;i++){
  var c=str.charCodeAt(i);if(w<0){w=c;continue;}
  var h=slot(w,c),found=-1;
  while(KW[h]!==-1){if(KW[h]===w&&KC[h]===c){found=KV[h];break;}h=(h+1)&mask;}
  if(found>=0){w=found;continue;}
  emit(w);
  EW.push(w);EC.push(c);KW[h]=w;KC[h]=c;KV[h]=next++;
  if(EW.length>cap*.6){alloc(cap*2);for(var j=0;j<EW.length;j++)put(EW[j],EC[j],65536+j);}
  if(next>=P2[bits])bits++;
  w=c;
 }
 if(w>=0)emit(w);
 if(nb>0)out.push(acc*P2[15-nb]+32);
 var s='',CH=8192;for(var k=0;k<out.length;k+=CH)s+=String.fromCharCode.apply(null,out.slice(k,k+CH));
 return str.length+':'+s;
}
function lzwUnpack(s){
 var p=s.indexOf(':'),n=+s.slice(0,p),data=s.slice(p+1);
 var dict=[],next=65536,bits=17,acc=0,nb=0,i=0,res=[],total=0,prev=null;
 function entry(code){return code<65536?String.fromCharCode(code):dict[code-65536];}
 function read(){while(nb<bits){if(i>=data.length)return -1;acc=acc*32768+(data.charCodeAt(i++)-32);nb+=15;}nb-=bits;var d=P2[nb],v=Math.floor(acc/d);acc-=v*d;return v;}
 while(total<n){
  var code=read();if(code<0)break;var cur;
  if(prev===null)cur=entry(code);
  else{cur=code<next?entry(code):prev+prev.charAt(0);dict.push(prev+cur.charAt(0));next++;}
  if(cur==null)throw new Error('broken save');
  if(next+1>=P2[bits])bits++;
  res.push(cur);total+=cur.length;prev=cur;
 }
 var out=res.join('');if(out.length<n)throw new Error('broken save');
 return out.slice(0,n);
}
/* 'LZ1' で始まれば圧縮済み、'{' で始まれば旧形式のJSON */
function packSave(o){return 'LZ1'+lzwPack(JSON.stringify(o));}
function unpackSave(t){
 if(!t)return null;t=String(t).trim();
 if(t.charAt(0)==='{')return JSON.parse(t);
 if(t.slice(0,3)==='LZ1')return JSON.parse(lzwUnpack(t.slice(3)));
 return null;
}

/* ============ 画面 ============ */
var UI={tab:'home',sub:{team:'squad',match:'sched',mkt:'market',biz:'money'},tier:null,mktPos:'all',mktType:'all',sort:'pos',wiz:null,secAll:false};
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function gb(v){var g=grade(v);return '<span class="g '+g+'">'+g+'</span>';}
function ovrBox(v,cls,label){var g=grade(v);return '<span class="ovr '+g+(cls?' '+cls:'')+'"><b>'+Math.round(v)+'</b><small>'+(label||'OVR')+'</small></span>';}
/* ---------- 画面に出すリーグ名・大会名の言い換え ----------
 * 内部のキー（J1〜JFL など）やニュースの記録はそのままに、画面の文字だけを架空の名前に置き換える。
 * .nolg の中（タイトルロゴ）は対象外 */
var LG_REP=[['AFCチャンピオンズリーグエリート','アジアクラブ選手権'],['ACLE','アジアクラブ選手権'],['ルヴァンカップ','リーグカップ'],['ルヴァン杯','リーグカップ'],['ルヴァン','リーグカップ'],['天皇杯','全日本選手権'],['Jリーグ','Nリーグ'],['Jクラブ','Nリーグクラブ'],['JFA','サッカー協会'],['JFL','NSL'],['J1','N1'],['J2','N2'],['J3','N3']];
var LG_MAP={};LG_REP.forEach(function(r){LG_MAP[r[0]]=r[1];});
var LG_RE=new RegExp(LG_REP.map(function(r){return r[0];}).join('|'),'g'),LG_TEST=new RegExp(LG_RE.source);

function mixHex(a,b,t){var x=rgbOf(a),y=rgbOf(b);return '#'+x.map(function(v,i){return ('0'+Math.round(v+(y[i]-v)*t).toString(16)).slice(-2);}).join('');}

 else if(pat==='diag')h+='<polygon points="0,64 64,0 100,0 100,36 36,100 0,100" fill="'+c2+'"/>';

 h+='</g>';
 var lineC=lum(c1)>.6?'#2a2f2c':(Math.abs(lum(c1)-lum(c2))<.08?'#ffffff':c2);
 h+='<g fill="none" stroke="'+lineC+'" stroke-width="5">'+shape+'</g>';
 var solid=pat==='solid'&&Math.abs(lum(c1)-lum(c2))>.12,fg=solid?c2:'#ffffff',sk=solid?'none':'rgba(0,0,0,.5)';
 if(sym!=='none'){
  var SY=EM_SYMS[sym],ss=typeof SY==='string'?SY:SY.s,cut=typeof SY==='string'?'':(SY.c||'');
  if(cut)h+='<defs><mask id="m'+id+'" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><rect width="100" height="100" fill="#fff"/><g fill="#000" stroke="none">'+cut+'</g></mask></defs>';
  h+='<g'+(cut?' mask="url(#m'+id+')"':'')+' fill="'+(em.sym==='ball'?'#ffffff':fg)+'" stroke="'+(em.sym==='ball'?'#222':sk)+'" stroke-width="2.5" stroke-linejoin="round" paint-order="stroke">'+ss+'</g>';
 }
 txt=String(txt||'').slice(0,4);
 if(txt){
  var big=sym==='none',fs=big?(txt.length<=2?28:txt.length===3?22:17):(txt.length<=3?14:12);
  /* 漢字・かなは英字の倍ほど幅を取るので、枠からはみ出さない大きさに縮める */
  var em=0;for(var ti=0;ti<txt.length;ti++){var cc=txt.charCodeAt(ti);em+=cc>=0x2E80?1.02:cc>=97&&cc<=122?.5:.58;}
  fs=Math.min(fs,(big?62:50)/Math.max(.5,em));
  h+='<text x="50" y="'+(big?61:85)+'" text-anchor="middle" font-size="'+fs+'" font-weight="700" font-family="Barlow Condensed,BIZ UDPGothic,sans-serif" fill="'+fg+'" stroke="'+sk+'" stroke-width="2.5" paint-order="stroke" letter-spacing=".5">'+esc(txt)+'</text>';
 }
 return h+'</svg>';
}

 var c=o.clubs[o.me],keep=S,rank=0;
 try{S=o;rank=c.mp?rankOf(o.me):0;}catch(e){}S=keep;

 S.ids={p:_pid,c:_cid,s:_sid,i:_iid};

 var safari=/AppleWebKit/.test(ua)&&/Safari/.test(ua)&&!/Chrome|Chromium|Edg|OPR|Firefox|Android/.test(ua);

var TYPEN={off:'得点力',def:'守備力',pow:'フィジカル',spd:'スピード',tec:'テクニック',sta:'スタミナ'};
var ABD={off:'シュート・決定力。FWとトップ下の得点に直結',def:'対人守備・ボール奪取。DFとボランチの守り',pow:'競り合い・空中戦。CBやCF、セットプレーに効く',spd:'走力・加速。サイドの突破と背後のカバー',tec:'パス・トラップ・ドリブル。中盤の支配力',sta:'運動量・持久力。疲れにくく、守備でも走れる'};
function abVal(p,k,known){return known?p.ab[k]:seeAb(p,k);}
function typeOf(p,known){var ks=ABK.filter(function(k){return !(p.pos==='GK'&&k==='off');}).sort(function(a,b){return abVal(p,b,known)-abVal(p,a,known);});return TYPEN[ks[0]]+'・'+TYPEN[ks[1]];}
/* 並び替え：OVR・年齢・ポジションなど。get(x)で行の要素から選手を取り出す（推定値で並べる） */
function listSorter(k,get,pot){
 function P(x){return get?get(x):x;}
 function so(p){return p?(p.club===S.me?ovr(p):seeOvr(p)):0;}
 var f={ovr:function(a,b){return so(P(b))-so(P(a));},age:function(a,b){return (P(a)?P(a).age:0)-(P(b)?P(b).age:0)||so(P(b))-so(P(a));},
  pos:function(a,b){var x=P(a),y=P(b);return (x&&y?POS.indexOf(x.pos)-POS.indexOf(y.pos):0)||so(y)-so(x);},
  sal:function(a,b){return (P(b)?P(b).sal:0)-(P(a)?P(a).sal:0);},
  pot:function(a,b){return (P(b)?seePot(P(b)):0)-(P(a)?seePot(P(a)):0);}};
 return f[k]||f.ovr;
}

function capWhy(p){
 var mc=myClub(),ten=S.year-(p.since||mc.founded||2026),share=(p.st.ap+p.st.cap)/Math.max(1,mc.mp),r=[];
 if(ten>=3)r.push('在籍'+(ten+1)+'年目');else if(p.since>=S.year)r.push('今季加入');

/* 布陣の枠を「列」にまとめる（縦位置が近い枠は同じ列）。列どうしは等間隔に置き、4人以上の列は横にも等間隔に広げる。
 * 名前や数字が隣の選手と重ならないようにするため。k:列番号（0=GK） n:列の数 off:列内の前後のずれ x:横位置(0〜1) */
var _flc={};
function formLayout(form){
 if(_flc[form])return _flc[form];
 var F=FORMS[form]||FORMS['4-4-2'],ord=F.s.map(function(s,i){return i;}).sort(function(a,b){return F.s[a][2]-F.s[b][2];});
 var lines=[],cur=null,prev=-1,out=[];
 ord.forEach(function(i){var y=F.s[i][2];if(cur&&y-prev<=.1001)cur.push(i);else{cur=[i];lines.push(cur);}prev=y;});
 lines.forEach(function(L,k){
  var m=sum(L,function(i){return F.s[i][2];})/L.length,xs=L.slice().sort(function(a,b){return F.s[a][1]-F.s[b][1];});
  var lo=F.s[xs[0]][1],hi=F.s[xs[xs.length-1]][1],px=xs.map(function(i){return F.s[i][1];});
  if(L.length>=4){if(L.length>=5){lo=Math.min(lo,.03);hi=Math.max(hi,.97);}px=px.map(function(_,j){return lo+(hi-lo)*j/(L.length-1);});}
  else if(L.length>=2){var gap=9,c=(lo+hi)/2;for(var j=1;j<px.length;j++)gap=Math.min(gap,px[j]-px[j-1]);if(gap<.3)px=px.map(function(x){return clamp(c+(x-c)*.3/Math.max(.01,gap),.03,.97);});}
  xs.forEach(function(i,j){out[i]={k:k,n:lines.length,cnt:L.length,off:clamp(F.s[i][2]-m,-.06,.06),x:px[j]};});
 });
 return _flc[form]=out;
}

/* ---------- 試合結果・経過・分析 ---------- */
var ZN=['左サイド','中央','右サイド'],GK_N={L:'左サイドから',C:'中央から',R:'右サイドから',SP:'セットプレーから',PK:'PK'};
/* ゾーンの攻撃力÷守備力の平均値（リーグ全体の目安）。これを1として優勢・劣勢を判断する */
var ZR_BASE=[.64,.715,.64];
function zrel(a,side,z){return a.zr[side][z]/ZR_BASE[z];}
function pct(v){return Math.round(v*100)+'%';}
function argmax(a){var b=0;for(var i=1;i<a.length;i++)if(a[i]>a[b])b=i;return b;}
function mnt(m,x){return m+(x?'+'+x:'')+"'";}
/* 自クラブの先発のうち、あるゾーン（0左・1中央・2右）を担当する選手 */
function zonePlayers(r,z,role){
 var F=FORMS[r.fm],out=[];if(!F||!r.xi)return out;
 r.xi.forEach(function(id,i){
  var p=S.P[id],sl=F.s[i];if(!p||!sl||sl[0]==='GK')return;
  var w=zw(sl[1])[z],R=ROLE[sl[0]],k=role==='def'?R.d*w:R.a*w;
  if(k<.3)return;
  out.push({p:p,pos:sl[0],w:k,v:(role==='def'?defR(p,sl[0]):atkR(p,sl[0]))*fitOf(p,sl[0])});
 });
 return out;
}
function abShort(p,k){return ABN[k]+' '+grade(p.ab[k]);}
function analyzeMatch(r){
 var a=r.an;if(!a)return null;
 var gM=r.gf,gO=r.ga,xM=a.xg[0],xO=a.xg[1],res=r.res,ev=r.ev||[],lg=r.log||[];
 var spM=ev.filter(function(e){return e.me&&(e.k==='SP'||e.k==='PK');}).length,spO=ev.filter(function(e){return !e.me&&(e.k==='SP'||e.k==='PK');}).length;
 var rel0=[0,1,2].map(function(z){return zrel(a,0,z);}),rel1=[0,1,2].map(function(z){return zrel(a,1,z);});
 var F=[],goals=lg.filter(function(o){return o.t==='goal';});
 var dx=xM-xO;
 if(Math.abs(dx)>=.35)F.push({s:dx*1.2,t:dx>0?'決定機の数と質で上回った（ゴール期待値 '+xM.toFixed(1)+' 対 '+xO.toFixed(1)+'）':'相手に多くの決定機を作られた（ゴール期待値 '+xM.toFixed(1)+' 対 '+xO.toFixed(1)+'）'});
 var fm=gM-xM,fo=gO-xO;
 if(fm>=.9)F.push({s:fm*.9,t:'好機を確実にものにした（期待値'+xM.toFixed(1)+'で'+gM+'得点）'});
 if(fm<=-.9)F.push({s:fm*.9,t:'好機を決めきれなかった（期待値'+xM.toFixed(1)+'で'+gM+'得点）'});
 if(fo<=-.9)F.push({s:-fo*.8,t:'GKと守備陣が粘り、相手の決定機をしのいだ（相手の期待値'+xO.toFixed(1)+'で'+gO+'失点）'});
 if(fo>=.9)F.push({s:-fo*.8,t:'相手に決定機をことごとく決められた（相手の期待値'+xO.toFixed(1)+'で'+gO+'失点）'});
 var bz=argmax(rel0),wz=argmax(rel1);
 if(rel0[bz]>=1.15&&a.zs[0][bz]>=.35)F.push({s:(rel0[bz]-1)*1.4,t:ZN[bz]+'の攻防で優位に立ち、好機の'+pct(a.zs[0][bz])+'をここから作った'});
 if(rel1[wz]>=1.15&&a.zs[1][wz]>=.35)F.push({s:-(rel1[wz]-1)*1.4,t:'相手の'+ZN[wz]+'攻撃（こちらの'+ZN[2-wz]+'の守備）を止められず、相手の好機の'+pct(a.zs[1][wz])+'がここから生まれた'});
 if(r.poss>=58)F.push({s:(r.poss-50)/25,t:'中盤を支配してボールを握った（支配率'+r.poss+'%）'});
 if(r.poss<=42)F.push({s:(r.poss-50)/25,t:'中盤で後手に回り、ボールを握られた（支配率'+r.poss+'%）'});
 if(spM)F.push({s:spM*.8,t:'セットプレー・PKから'+spM+'得点'});
 if(spO)F.push({s:-spO*.8,t:'セットプレー・PKから'+spO+'失点'});
 if(r.reds&&r.reds.length)r.reds.forEach(function(x){var ms=x.sh1[0]-x.sh0[0],os=x.sh1[1]-x.sh0[1],mg=x.g1[0]-x.g0[0],og=x.g1[1]-x.g0[1],ro=lg.filter(function(o){return o.t==='rc'&&o.m===x.m&&o.me===x.me;})[0],nm=ro?ro.n:'';
  if(x.me)F.push({s:-(1+og*.4),t:nm+'の退場（'+x.m+"'）で10人に。以降のシュートは"+ms+' - '+os+(og?'、'+og+'失点':'で、失点は防いだ')});
  else F.push({s:1+mg*.4,t:'相手の'+nm+'の退場（'+x.m+"'）後、シュート "+ms+' - '+os+'と押し込'+(mg?'み、'+mg+'得点':'んだが、決めきれなかった')});});
 else lg.filter(function(o){return o.t==='rc';}).forEach(function(o){F.push({s:o.me?-1.1:1.1,t:(o.me?'':'相手の')+o.n+'の退場（'+mnt(o.m,o.x)+'）で'+(o.me?'数的不利に陥った':'数的優位に立った')});});
 /* 試合中の采配：攻勢に出た後の得点 */
 lg.filter(function(o){return o.t==='ment'&&o.me&&o.to===1;}).slice(0,1).forEach(function(o){var g=goals.filter(function(x){return x.me&&x.m>=o.m;}).length;if(g)F.push({s:.9+g*.3,t:o.m+"'に前線の枚数を増やした采配が実り、"+g+'得点'});});
 /* 決勝点（勝者が最後にリードを奪ったゴール）や終盤の同点弾 */
 if(goals.length&&!r.pk){
  if(res!=='D'){var mine=res==='W',wg=goals.filter(function(o){return o.me===mine;}),dg=wg[(mine?gO:gM)];
   if(dg&&dg.m>=80)F.push({s:mine?1.2:-1.2,t:mine?'終盤'+mnt(dg.m,dg.x)+'の'+dg.n+'のゴールが決勝点に':'終盤'+mnt(dg.m,dg.x)+'に決勝点を奪われた'});}
  else{var lg2=goals[goals.length-1];if(lg2.m>=85)F.push({s:lg2.me?1:-1,t:lg2.me?'終盤'+mnt(lg2.m,lg2.x)+'、'+lg2.n+'の同点弾で追いついた':'終盤'+mnt(lg2.m,lg2.x)+'に追いつかれた'});}
 }
 if(a.g1){if(a.g1[0]<a.g1[1]&&res==='W')F.push({s:1.3,t:'前半のビハインドを後半にひっくり返した'});if(a.g1[0]>a.g1[1]&&res!=='W')F.push({s:-1.3,t:'前半のリードを守り切れなかった'});}
 var subG=goals.filter(function(o){return o.me&&(r.rt||[]).some(function(x){return x.sub&&S.P[x.id]&&pshort(S.P[x.id])===o.n;});});
 if(subG.length)F.push({s:.8,t:'途中出場の'+subG[0].n+'が流れを変えた'});
 var mu=matchupVal(r.fm,a.st[0],r.ofm,a.st[1]);
 if(Math.abs(mu)>=.07)F.push({s:mu*5,t:'布陣と戦い方の相性（'+r.fm+'・'+STYLES[a.st[0]].n+' 対 '+r.ofm+'・'+STYLES[a.st[1]].n+'）が'+(mu>0?'有利':'不利')+'に働いた'});
 var td=a.tac[0]-a.tac[1];
 if(Math.abs(td)>=15)F.push({s:td/30,t:td>0?'ベンチワークの差が出た':'相手ベンチの采配に後手を踏んだ'});
 if(a.fam<85)F.push({s:-(100-a.fam)/30,t:'指示した布陣・戦い方がまだ浸透しておらず、連係に乱れがあった'});
 var pos=F.filter(function(x){return x.s>0;}).sort(function(x,y){return y.s-x.s;}),neg=F.filter(function(x){return x.s<0;}).sort(function(x,y){return x.s-y.s;});
 var keys=res==='W'?pos.slice(0,3):res==='L'?neg.slice(0,3):pos.slice(0,1).concat(neg.slice(0,2));
 if(!keys.length)keys=F.slice().sort(function(x,y){return Math.abs(y.s)-Math.abs(x.s);}).slice(0,2);
 var head=(res==='W'?'勝因：':res==='L'?'敗因：':'')+(keys.length?keys[0].t:(res==='D'?'互いに決め手を欠いた':'内容は互角だった'));
 if(res==='D'&&keys.length)head='引き分け。'+keys[0].t;
 /* 課題 */
 var iss=[],acts=[];
 if(rel1[wz]>=1.05&&a.zs[1][wz]>=.36){
  var dz=2-wz,dp=zonePlayers(r,dz,'def').sort(function(x,y){return x.v-y.v;})[0];
  iss.push('こちらの'+ZN[dz]+'の守備：相手の好機の'+pct(a.zs[1][wz])+'をここから許した'+(dp?'。担当の'+esc(pshort(dp.p))+'（'+dp.pos+'）は'+(dp.p.ab.spd<dp.p.ab.def?'スピードで振り切られる場面が目立った':'1対1の対応で後手に回った'):''));
  if(dp)acts.push(['mkt','market',ZN[dz]+'の守備を補強する']);

/* ---------- クラブの概況：収支の円グラフと主な指標 ----------

 * 支出が収入を上回るときは支出全体を100%とし、収入でまかなえない分を外側の赤い弧で示す */
var PIE_SEG=[['players','選手年俸','--v1'],['coach','監督年俸','--v2'],['fixed','固定費','--v3'],['invest','投資（施設・移籍金など）','--v4']];

function pctOf(v,t){return t>0?Math.round(v/t*100):0;}
function donutSVG(o,size,thick){
 var def=o.surplus<0,total=Math.max(1,def?o.spend:o.rev),cx=size/2,r=(size-thick)/2-(def?6:1),C=2*Math.PI*r,acc=0;
 var segs=PIE_SEG.map(function(s){return {n:s[1],c:'var('+s[2]+')',v:o[s[0]]};}).filter(function(s){return s.v>0;});
 if(!def&&o.surplus>0)segs.push({n:'余剰',c:'var(--v-rest)',v:o.surplus});
 var gap=segs.length>1?2:0,h='<svg class="donut" viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="'+esc(segs.map(function(s){return s.n+' '+pctOf(s.v,o.rev)+'%';}).join('、'))+'"><g transform="rotate(-90 '+cx+' '+cx+')">';
 h+='<circle cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="var(--v-rest)" stroke-width="'+thick+'" opacity="'+(segs.length?0:1)+'"/>';
 segs.forEach(function(s){var len=s.v/total*C,dash=Math.max(.01,len-gap);
  h+='<circle class="sl" cx="'+cx+'" cy="'+cx+'" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="'+thick+'" stroke-dasharray="'+dash.toFixed(2)+' '+(C-dash).toFixed(2)+'" stroke-dashoffset="'+(-acc).toFixed(2)+'"><title>'+esc(s.n+' '+money(s.v)+'（収入の'+pctOf(s.v,o.rev)+'%）')+'</title></circle>';
  acc+=len;});
 if(def){var R2=r+thick/2+4,C2=2*Math.PI*R2,cov=o.rev/total,l2=Math.max(.01,(1-cov)*C2);
  h+='<circle cx="'+cx+'" cy="'+cx+'" r="'+R2.toFixed(2)+'" fill="none" stroke="var(--v-crit)" stroke-width="3" stroke-dasharray="'+l2.toFixed(2)+' '+(C2-l2).toFixed(2)+'" stroke-dashoffset="'+(-cov*C2).toFixed(2)+'"><title>'+esc('収入でまかなえない分 '+money(-o.surplus))+'</title></circle>';}
 return h+'</g></svg>';
}
